<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0,
               user-scalable=no, viewport-fit=cover">

<title>ALCHEMIST | MASTER LAB v131.14</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#000;
  --panel:#0c0c0c;
  --gold:#ffd600;
  --green:#2ecc71;
  --border:#222;
  --font-ui:'Inter',sans-serif;
  --font-code:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;height:100vh;background:var(--bg);color:#fff;
  font-family:var(--font-ui);overflow:hidden;
}

/* HEADER */
#top{
  padding:40px 30px 20px;
  display:flex;justify-content:space-between;align-items:center;
}
.brand{
  color:var(--gold);
  font-weight:900;
  font-size:2.2rem;
}
.sub{
  font-family:var(--font-code);
  font-size:.7rem;
  color:#555;
}

/* EDITOR */
#editor{
  margin:20px 30px;
  background:#050505;
  border:1px solid var(--border);
  border-radius:18px;
  padding:20px;
}
textarea{
  width:100%;
  height:35vh;
  background:#000;
  color:var(--green);
  border:none;
  resize:none;
  font-family:var(--font-code);
  font-size:.75rem;
  line-height:1.5;
  outline:none;
}

/* ACTIONS */
.actions{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
  margin:20px 30px;
}
.btn{
  padding:18px;
  border-radius:20px;
  background:#111;
  border:1px solid #333;
  color:#aaa;
  font-weight:900;
  font-size:.75rem;
  text-align:center;
  cursor:pointer;
}
.btn.gold{
  background:var(--gold);
  color:#000;
  border:none;
}
.btn:active{transform:scale(.96)}

/* FOOT */
.footer{
  position:absolute;bottom:18px;width:100%;
  text-align:center;
  font-family:var(--font-code);
  font-size:.6rem;color:#444;
}
</style>
</head>

<body>

<div id="top">
  <div>
    <div class="brand">MASTER LAB</div>
    <div class="sub">v131.14 · DIRECT MASTER INJECT</div>
  </div>
  <div class="sub" style="color:var(--green)">DB: CONNECTED</div>
</div>

<div id="editor">
  <textarea id="input"
    placeholder="Paste TSV / CSV / JSON here…
Atomic sanitization is enforced."></textarea>
</div>

<div class="actions">
  <div class="btn gold" onclick="exportPDF()">EXPORT PDF</div>
  <div class="btn" onclick="exportTSV()">EXPORT TSV</div>
  <div class="btn" onclick="exportJSON()">EXPORT JSON</div>
  <div class="btn" onclick="exportTEXT()">EXPORT TEXT</div>
  <div class="btn" onclick="clearInput()">CLEAR</div>
  <div class="btn" onclick="goBack()">BACK</div>
</div>

<div class="footer">IndexedDB · Local · Offline Ready</div>

<script>
/* ---------------- SAFETY CORE ---------------- */
function jsSafe(v){
  if(v === null || v === undefined) return "";
  return v.toString()
    .replace(/\\/g,"\\\\")
    .replace(/`/g,"\\`")
    .replace(/\$/g,"\\$")
    .replace(/<\/script>/gi,"<\\/script>")
    .replace(/\u2028|\u2029/g,"");
}

/* ---------------- PARSER ---------------- */
function parseTSV(raw){
  const lines = raw.replace(/\r/g,"").split("\n");
  if(lines.length < 2) return [];
  const headers = lines[0].split("\t");
  const rows = [];
  for(let i=1;i<lines.length;i++){
    if(!lines[i].trim()) continue;
    const cols = lines[i].split("\t");
    const obj = {};
    headers.forEach((h,j)=>obj[h]=jsSafe(cols[j]||""));
    rows.push(obj);
  }
  return rows;
}

/* ---------------- EXPORTERS ---------------- */
function exportPDF(){
  const raw = document.getElementById("input").value.trim();
  if(!raw) return alert("EMPTY BUFFER");

  const rows = parseTSV(raw);
  if(!rows.length) return alert("INVALID DATA");

  let html =
    "<html><head><meta charset='UTF-8'><style>"+
    "body{font-family:sans-serif;padding:50px;color:#111;}"+
    "h1{border-bottom:4px solid #000;}"+
    ".card{margin-bottom:30px;border-bottom:1px solid #ddd;padding-bottom:15px;}"+
    ".q{font-weight:bold;font-size:18px;}"+
    ".a{color:#2979FF;font-weight:bold;}"+
    "</style></head><body>"+
    "<h1>Academic Export</h1>"+
    "<div style='font-size:10px;color:#777'>"+
    new Date().toLocaleString()+"</div>";

  rows.forEach(r=>{
    html +=
      "<div class='card'>"+
      "<div class='q'>"+(r.Question||r.question||"")+"</div>"+
      "<div class='a'>Answer: "+(r.Ans||r.ans||"")+"</div>"+
      "<div>"+(r.Expl||r.expl||"")+"</div>"+
      "</div>";
  });

  html += "</body></html>";

  const blob = new Blob([html],{type:"text/html"});
  const url = URL.createObjectURL(blob);
  const w = window.open(url,"_blank");
  if(w) w.onload=()=>setTimeout(()=>w.print(),400);
}

function exportTSV(){
  download("export.tsv",
    document.getElementById("input").value,"text/tab-separated-values");
}

function exportJSON(){
  const rows = parseTSV(document.getElementById("input").value);
  download("export.json",JSON.stringify(rows,null,2),"application/json");
}

function exportTEXT(){
  download("export.txt",
    document.getElementById("input").value,"text/plain");
}

/* ---------------- HELPERS ---------------- */
function download(name,data,type){
  const blob = new Blob([data],{type});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
}
function clearInput(){ document.getElementById("input").value=""; }
function goBack(){ location.href="admin.html"; }
</script>

</body>
</html>
