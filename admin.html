<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALCHEMIST | COMMAND CONSOLE</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #050505; --panel: #0a0a0a; --border: #1a1a1a; --gold: #ffd600; --blue: #2979FF; --green: #2ecc71; --red: #ff4444; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        .header { padding: 15px 20px; border-bottom: 1px solid var(--border); background: #000; display: flex; justify-content: space-between; align-items: center; }
        h1 { font-weight: 900; color: var(--gold); font-size: 0.9rem; letter-spacing: 2px; margin: 0; text-transform: uppercase; }
        .nav-btn { background: #111; border: 1px solid #333; color: #fff; padding: 6px 12px; border-radius: 4px; font-size: 0.65rem; font-weight: 700; cursor: pointer; text-decoration: none; }
        .workspace { flex: 1; display: grid; grid-template-columns: 280px 1fr; gap: 1px; background: var(--border); overflow: hidden; }
        .sidebar { background: var(--panel); display: flex; flex-direction: column; border-right: 1px solid var(--border); }
        .panel-head { padding: 15px; background: #080808; border-bottom: 1px solid var(--border); }
        .vault-list { flex: 1; overflow-y: auto; padding: 5px; }
        .vault-item { display: flex; justify-content: space-between; padding: 12px; margin-bottom: 4px; background: #0e0e0e; border: 1px solid var(--border); border-radius: 6px; cursor: pointer; }
        .vault-item:hover { background: #151515; }
        .editor-area { background: #050505; display: flex; flex-direction: column; }
        textarea { flex: 1; background: #000; color: var(--green); border: none; padding: 25px; font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; resize: none; }
        .action-matrix { background: #080808; border-top: 1px solid var(--border); padding: 10px; display: flex; gap: 10px; flex-wrap: wrap; }
        button { padding: 10px; border: 1px solid #222; background: #0e0e0e; color: #888; font-weight: 700; cursor: pointer; border-radius: 4px; flex: 1; }
        button:hover { color: #fff; background: #151515; }
        .btn-main { background: var(--blue); color: #fff; }
        #vault-search { width: 100%; background: #111; border: 1px solid #222; color: #fff; padding: 8px; margin-top:10px; }
    </style>
</head>
<body>

<div class="header">
    <h1>Alchemist Command Console</h1>
    <a href="index.html" target="_blank" class="nav-btn">LAUNCH TERMINAL ↗</a>
</div>

<div class="workspace">
    <div class="sidebar">
        <div class="panel-head">
            <span style="font-size:0.7rem; font-weight:900; color:#666;">VAULT REGISTRY</span>
            <input type="text" id="vault-search" placeholder="FILTER..." onkeyup="refreshLib()">
        </div>
        <div id="vault-list" class="vault-list"></div>
    </div>

    <div class="editor-area">
        <textarea id="data-input" placeholder=">> LOAD A VAULT OR PASTE DATA"></textarea>
        <div class="action-matrix">
            <button onclick="generatePDF()" style="color:var(--gold); border-color:#443300;">PRINT PDF</button>
            <button onclick="exportData('json')">EXP JSON</button>
            <button class="btn-main" onclick="atomicInjection()">INJECT DATA</button>
            <button onclick="nukeVault()" style="color:var(--red);">DELETE</button>
        </div>
    </div>
</div>

<script>
    let db, currentVault = null;
    const R1_SCHEMA = ["ID", "SET", "DOM", "DEP", "LEVEL", "QUESTION", "UP", "RIGHT", "LEFT", "ANS", "EXPL", "HINT", "CONTEXT", "REF", "TAGS", "IMAGE", "LINK", "NOTE", "DATE", "REV", "W_UP", "W_SIDE", "STEP_1", "STEP_2"];

    const request = indexedDB.open("AlchemistDB", 1);
    request.onupgradeneeded = e => e.target.result.createObjectStore("Vaults");
    request.onsuccess = e => { db = e.target.result; refreshLib(); };

    function refreshLib() {
        const list = document.getElementById('vault-list'); list.innerHTML = "";
        const filter = document.getElementById('vault-search').value.toLowerCase();
        db.transaction(["Vaults"], "readonly").objectStore("Vaults").openCursor().onsuccess = e => {
            const cursor = e.target.result;
            if (cursor) {
                if (!filter || cursor.key.toLowerCase().includes(filter)) {
                    const div = document.createElement('div'); div.className = "vault-item";
                    div.innerHTML = `<span style="font-size:0.8rem; font-weight:bold; color:#eee">${cursor.key}</span><span style="color:#555; font-size:0.7rem">${cursor.value.length} items</span>`;
                    div.onclick = () => loadVault(cursor.key);
                    list.appendChild(div);
                }
                cursor.continue();
            }
        };
    }

    function loadVault(name) {
        currentVault = name;
        db.transaction(["Vaults"]).objectStore("Vaults").get(name).onsuccess = e => {
            const data = e.target.result || [];
            let tsv = R1_SCHEMA.join("\t") + "\n";
            data.forEach(r => { tsv += R1_SCHEMA.map(k => r[k.toLowerCase()] || "---").join("\t") + "\n"; });
            document.getElementById('data-input').value = tsv;
        };
    }

    async function atomicInjection() {
        const raw = document.getElementById('data-input').value.trim();
        if (!raw) return alert("EMPTY");
        let lines = raw.split(/\r?\n/).filter(l => l.trim() !== "");
        // Header logic
        let hIdx = lines.findIndex(l => l.toLowerCase().includes("id"));
        if(hIdx === -1) { lines.unshift(R1_SCHEMA.join('\t')); hIdx = 0; } else { lines = lines.slice(hIdx); }
        
        const map = {}; lines[0].split('\t').forEach((h,i) => map[h.trim().toUpperCase()] = i);
        const batches = {};

        for(let i=1; i<lines.length; i++) {
            const cols = lines[i].split('\t');
            if(cols.length < 2) continue;
            let obj = {};
            R1_SCHEMA.forEach(k => { obj[k.toLowerCase()] = (cols[map[k]] || "---").trim(); });
            const set = obj.set !== "---" ? obj.set.toUpperCase() : "UNSORTED";
            if(!batches[set]) batches[set] = [];
            batches[set].push(obj);
        }

        const tx = db.transaction(["Vaults"], "readwrite");
        for(const set in batches) {
            tx.objectStore("Vaults").put(batches[set], set);
        }
        tx.oncomplete = () => { alert("SAVED"); refreshLib(); };
    }

    function nukeVault() {
        if(currentVault && confirm("DELETE?")) {
            const tx = db.transaction(["Vaults"], "readwrite");
            tx.objectStore("Vaults").delete(currentVault);
            tx.oncomplete = () => { document.getElementById('data-input').value = ""; refreshLib(); };
        }
    }

    function exportData(type) {
        const raw = document.getElementById('data-input').value;
        const blob = new Blob([type === 'json' ? JSON.stringify(parseRaw(raw), null, 2) : raw], {type: "text/plain"});
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
        a.download = `backup.${type}`; a.click();
    }

    function parseRaw(raw) {
        let lines = raw.split(/\r?\n/).filter(l => l.trim() !== "");
        let hIdx = lines.findIndex(l => l.toLowerCase().includes("id"));
        if(hIdx === -1) { lines.unshift(R1_SCHEMA.join('\t')); hIdx = 0; }
        return lines.slice(1).map(l => {
            const c = l.split('\t');
            return R1_SCHEMA.reduce((acc, k, i) => ({...acc, [k.toLowerCase()]: c[i] || "---"}), {});
        });
    }

    // --- PDF GENERATOR (FIXED BACKTICKS) ---
    function generatePDF() {
        const data = parseRaw(document.getElementById('data-input').value);
        if(!data.length) return alert("No Data");
        
        const win = window.open('', '_blank');
        const setID = currentVault || 'EXPORT';
        
        // CRITICAL: The string below uses BACKTICKS (`), not single quotes (')
        const html = `
            <!DOCTYPE html>
            <html>
            <head>
                <title>${setID}</title>
                <style>
                    body { font-family: sans-serif; padding: 40px; }
                    .item { margin-bottom: 20px; border-bottom: 1px solid #ccc; padding-bottom: 20px; page-break-inside: avoid; }
                    .q { font-size: 14pt; font-weight: bold; margin-bottom: 5px; }
                    .ans { color: #444; font-style: italic; }
                    .meta { font-size: 8pt; color: #888; text-transform: uppercase; margin-bottom: 5px; }
                </style>
            </head>
            <body>
                <h1>${setID}</h1>
                <p>${data.length} ITEMS</p>
                <hr>
                ${data.map(d => `
                    <div class="item">
                        <div class="meta">${d.id} | ${d.dom} | LVL ${d.level}</div>
                        <div class="q">${fmt(d.question)}</div>
                        <div class="ans">ANS: ${d.ans}</div>
                        <div class="expl">LOGIC: ${fmt(d.expl)}</div>
                    </div>
                `).join('')}
            </body>
            </html>
        `;
        
        win.document.write(html);
        win.document.close();
        setTimeout(() => { win.focus(); win.print(); }, 500);
    }

    function fmt(t) {
        return (t||"").toString()
            .replace(/\^([0-9\+\-]+)/g, '<sup>$1</sup>')
            .replace(/_([0-9]+)/g, '<sub>$1</sub>');
    }
</script>
</body>
</html>
