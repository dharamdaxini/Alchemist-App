<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>VIA.STACK | SESSION v131.83</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Crimson+Text:wght@600&display=swap" rel="stylesheet">

<style>
body{margin:0;background:#000;color:#fff;font-family:Inter,sans-serif}
#top{padding:20px}
#vault{font-size:.7rem;color:#555}
#xp{color:#ffd600;font-weight:900}
#stack{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
.card{width:90%;max-width:420px;height:65vh;background:#0e0e0e;
border-radius:40px;padding:30px;font-family:Crimson Text,serif;
font-size:1.5rem;text-align:center;display:flex;align-items:center;
justify-content:center}
#overlay{position:fixed;inset:0;background:#000;display:none;
flex-direction:column;padding:30px}
button{margin-top:auto;padding:18px;background:#ffd600;
border:none;border-radius:14px;font-weight:900}
</style>
</head>

<body>

<div id="top">
<div id="vault"></div>
<div id="xp">0 XP</div>
</div>

<div id="stack"></div>

<div id="overlay">
<div id="logic"></div>
<button onclick="closeOverlay()">RESUME</button>
</div>

<script>
const key=sessionStorage.getItem("ACTIVE_VAULT");
if(!key)location.href="admin.html";

let db,POOL=[],DONE=[],XP=0;

indexedDB.open("AlchemistDB",1).onsuccess=e=>{
  db=e.target.result;
  load();
};

function load(){
  document.getElementById("vault").innerText=key;
  db.transaction("Vaults").objectStore("Vaults")
  .get(key).onsuccess=e=>{
    POOL=[...e.target.result.data].sort(()=>0.5-Math.random());
    next();
  };
}

function next(){
  if(!POOL.length){
    document.body.innerHTML="<h2 style='color:#ffd600;text-align:center;margin-top:40vh'>DONE</h2>";
    return;
  }
  const q=POOL[0];
  render(q);
}

function render(q){
  const s=document.getElementById("stack");
  s.innerHTML="";
  const c=document.createElement("div");
  c.className="card";
  c.innerText=q.question||"—";
  s.appendChild(c);

  let sx=0,x=0,drag=false;

  c.ontouchstart=e=>{drag=true;sx=e.touches[0].clientX};
  c.ontouchmove=e=>{
    if(!drag)return;
    x=e.touches[0].clientX-sx;
    c.style.transform=`translateX(${x}px) rotate(${x/25}deg)`;
  };
  c.ontouchend=()=>{
    drag=false;
    if(Math.abs(x)>120){
      if((x>0&&q.ans==="RIGHT")||(x<0&&q.ans==="LEFT"))XP+=10;
      DONE.push(POOL.shift());
      document.getElementById("xp").innerText=XP+" XP";
      next();
    }else if(x<-40){
      showLogic(q);
    }
    c.style.transform="none";
  };
}

function showLogic(q){
  document.getElementById("logic").innerText=q.expl||"";
  document.getElementById("overlay").style.display="flex";
}
function closeOverlay(){
  document.getElementById("overlay").style.display="none";
}
</script>

</body>
</html>
