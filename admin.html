<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ALCHEMIST | COMMAND CONSOLE v131.54</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #050505; --panel: #0a0a0a; --border: #1a1a1a;
            --gold: #ffd600; --blue: #2979FF; --green: #2ecc71; --red: #ff4444; 
            --font-ui: 'Inter', sans-serif; --font-code: 'JetBrains Mono', monospace; 
        }
        * { box-sizing: border-box; outline: none; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: var(--font-ui); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* HEADER */
        .header { 
            padding: 15px 20px; border-bottom: 1px solid var(--border); background: #000;
            display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;
        }
        h1 { font-weight: 900; color: var(--gold); font-size: 0.9rem; letter-spacing: 2px; margin: 0; text-transform: uppercase; }
        .nav-btn { background: #111; border: 1px solid #333; color: #fff; padding: 6px 12px; border-radius: 4px; font-size: 0.65rem; font-weight: 700; cursor: pointer; text-decoration: none; }
        .nav-btn:hover { border-color: var(--blue); color: var(--blue); }

        /* WORKSPACE */
        .workspace { flex: 1; display: grid; grid-template-columns: 280px 1fr; gap: 1px; background: var(--border); overflow: hidden; }
        
        /* LEFT: VAULT REGISTRY */
        .sidebar { background: var(--panel); display: flex; flex-direction: column; border-right: 1px solid var(--border); }
        .panel-head { padding: 15px; background: #080808; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 10px; }
        .registry-title { font-size: 0.65rem; font-weight: 900; color: #666; letter-spacing: 1px; display: flex; justify-content: space-between; }
        
        #vault-search { 
            background: #111; border: 1px solid #222; color: #fff; padding: 8px; 
            font-family: var(--font-code); font-size: 0.7rem; border-radius: 4px; 
            text-transform: uppercase;
        }
        #vault-search:focus { border-color: var(--blue); }

        .vault-list { flex: 1; overflow-y: auto; padding: 5px; }
        .vault-item { 
            display: flex; justify-content: space-between; align-items: center; padding: 12px; margin-bottom: 4px; 
            background: #0e0e0e; border: 1px solid var(--border); border-radius: 6px; cursor: pointer; transition: 0.2s; 
        }
        .vault-item:hover { border-color: #444; background: #151515; }
        .vault-item.active { border-color: var(--blue); background: #001529; }
        .vault-item.active .v-name { color: var(--blue); }
        
        .v-meta { display: flex; flex-direction: column; }
        .v-name { font-family: var(--font-code); font-size: 0.75rem; color: #eee; font-weight: 600; }
        .v-count { font-size: 0.6rem; color: #555; margin-top: 2px; }
        .btn-mini { background: #222; color: #888; border: none; padding: 4px 8px; border-radius: 3px; font-weight: 900; font-size: 0.55rem; }
        .vault-item:hover .btn-mini { background: var(--gold); color: #000; }

        /* RIGHT: QUANTUM EDITOR */
        .editor-area { background: #050505; display: flex; flex-direction: column; position: relative; }
        .editor-header { padding: 10px 20px; background: #080808; border-bottom: 1px solid var(--border); font-family: var(--font-code); font-size: 0.7rem; color: #555; }
        
        textarea { 
            flex: 1; background: #000; color: var(--green); border: none; padding: 25px; 
            font-family: var(--font-code); font-size: 0.75rem; resize: none; line-height: 1.6; white-space: pre; 
        }
        textarea::placeholder { color: #333; }
        
        .action-matrix { background: #080808; border-top: 1px solid var(--border); display: flex; flex-direction: column; }
        
        .export-row { 
            display: flex; gap: 5px; padding: 8px 20px; border-bottom: 1px solid #111; overflow-x: auto;
        }
        .btn-exp { 
            flex: 1; padding: 8px; border: 1px solid #222; background: #0e0e0e; color: #888; 
            font-family: var(--font-code); font-size: 0.6rem; font-weight: 700; cursor: pointer; border-radius: 4px; white-space: nowrap;
        }
        .btn-exp:hover { color: #fff; border-color: #444; background: #151515; }
        .btn-exp.pdf-btn { color: var(--gold); border-color: #443300; }

        .main-actions { padding: 12px 20px; display: flex; gap: 10px; align-items: center; }
        .btn { padding: 12px 20px; border-radius: 6px; font-weight: 900; font-size: 0.7rem; cursor: pointer; border: none; flex: 1; }
        .btn-main { background: var(--blue); color: #fff; }
        .btn-danger { background: transparent; color: var(--red); border: 1px solid #330000; flex: 0.4; }

        @media (max-width: 768px) { .workspace { grid-template-columns: 1fr; grid-template-rows: 250px 1fr; } }
    </style>
</head>
<body>

<div class="header">
    <h1>Alchemist Command Console</h1>
    <a href="index.html" target="_blank" class="nav-btn">LAUNCH TERMINAL ↗</a>
</div>

<div class="workspace">
    <div class="sidebar">
        <div class="panel-head">
            <div class="registry-title">
                <span>VAULT REGISTRY</span>
                <span id="total-count" style="color:var(--green)">0 ROWS</span>
            </div>
            <input type="text" id="vault-search" placeholder="FILTER VAULTS..." onkeyup="refreshLib()">
        </div>
        <div id="vault-list" class="vault-list"></div>
    </div>

    <div class="editor-area">
        <div class="editor-header" id="editor-status">WORKSPACE IDLE</div>
        <textarea id="data-input" placeholder=">> SELECT A VAULT FROM THE LEFT TO EDIT.
>> OR PASTE RAW TSV TO INJECT NEW DATA.
>> BEAST MODE ACTIVE: SUPPORTS 10,000+ ROWS WITH FAULT-TOLERANCE."></textarea>
        
        <div class="action-matrix">
            <div class="export-row">
                <button class="btn-exp pdf-btn" onclick="generatePDF()">PRINT / SAVE PDF</button>
                <button class="btn-exp" onclick="exportData('js')">JS OBJ</button>
                <button class="btn-exp" onclick="exportData('tsv')">TSV</button>
                <button class="btn-exp" onclick="exportData('csv')">CSV</button>
                <button class="btn-exp" onclick="exportData('json')">JSON</button>
            </div>
            <div class="main-actions">
                <button class="btn btn-main" onclick="atomicInjection()">INJECT / UPDATE DATABASE</button>
                <button class="btn btn-danger" onclick="nukeVault()">DELETE VAULT</button>
            </div>
        </div>
    </div>
</div>

<script>
    let db;
    let currentVault = null;
    const R1_SCHEMA = ["ID", "SET", "DOM", "DEP", "LEVEL", "QUESTION", "UP", "RIGHT", "LEFT", "ANS", "EXPL", "HINT", "CONTEXT", "REF", "TAGS", "IMAGE", "LINK", "NOTE", "DATE", "REV", "W_UP", "W_SIDE", "STEP_1", "STEP_2"];

    const request = indexedDB.open("AlchemistDB", 1);
    request.onupgradeneeded = e => { e.target.result.createObjectStore("Vaults"); };
    request.onsuccess = e => { db = e.target.result; refreshLib(); };

    // --- UPGRADED REGISTRY ---
    function refreshLib() {
        const list = document.getElementById('vault-list');
        const filter = document.getElementById('vault-search').value.toLowerCase();
        list.innerHTML = "";
        
        const tx = db.transaction(["Vaults"], "readonly");
        const store = tx.objectStore("Vaults");
        let totalRows = 0;
        let vaults = [];

        store.openCursor().onsuccess = e => {
            const cursor = e.target.result;
            if (cursor) {
                vaults.push({ key: cursor.key, count: cursor.value.length });
                totalRows += cursor.value.length;
                cursor.continue();
            } else {
                vaults.sort((a, b) => a.key.localeCompare(b.key));
                document.getElementById('total-count').innerText = `${totalRows} ROWS`;

                vaults.forEach(v => {
                    if (filter && !v.key.toLowerCase().includes(filter)) return;

                    const el = document.createElement('div');
                    el.className = "vault-item";
                    if(currentVault === v.key) el.classList.add('active');
                    
                    el.innerHTML = `
                        <div class="v-meta">
                            <span class="v-name">${v.key}</span>
                            <span class="v-count">${v.count} RECORDS</span>
                        </div>
                        <button class="btn-mini">LOAD</button>
                    `;
                    el.onclick = () => loadVault(v.key);
                    list.appendChild(el);
                });
            }
        };
    }

    function loadVault(name) {
        currentVault = name;
        refreshLib();
        document.getElementById('editor-status').innerText = `EDITING: ${name}`;
        db.transaction(["Vaults"]).objectStore("Vaults").get(name).onsuccess = e => {
            const data = e.target.result || [];
            let tsv = R1_SCHEMA.join("\t") + "\n";
            data.forEach(row => { tsv += R1_SCHEMA.map(k => row[k.toLowerCase()] || "---").join("\t") + "\n"; });
            document.getElementById('data-input').value = tsv;
        };
    }

    // --- FAULT-TOLERANT INJECTION ---
    async function atomicInjection() {
        const raw = document.getElementById('data-input').value.trim();
        if (!raw) return alert("WORKSPACE EMPTY");
        
        let lines = raw.split(/\r?\n/).filter(l => l.trim() !== "");
        let hIdx = lines.findIndex(l => l.toLowerCase().includes("id") && l.toLowerCase().includes("question"));
        
        if (hIdx === -1) { lines.unshift(R1_SCHEMA.join('\t')); hIdx = 0; } 
        else { lines = lines.slice(hIdx); }
        
        const headers = lines[0].toLowerCase().split('\t').map(h => h.trim());
        const map = {}; 
        R1_SCHEMA.forEach(k => { map[k.toLowerCase()] = headers.findIndex(h => h.includes(k.toLowerCase())); });
        
        const batches = {};
        let successCount = 0;

        for (let i = 1; i < lines.length; i++) {
            const line = lines[i];
            const c = line.split('\t');
            if (c.length < 2 || line.toLowerCase().includes("id\tset")) continue;
            
            let obj = {};
            R1_SCHEMA.forEach(k => {
                const key = k.toLowerCase();
                const colIdx = map[key];
                let val = (colIdx > -1 && c[colIdx] !== undefined) ? c[colIdx].trim() : "---";
                if(val === "") val = "---";
                obj[key] = val;
            });
            
            const set = (obj.set && obj.set !== "---") ? obj.set.toUpperCase() : "UNSORTED";
            if (!batches[set]) batches[set] = [];
            batches[set].push(obj);
            successCount++;
        }

        const tx = db.transaction(["Vaults"], "readwrite");
        for (const set in batches) {
            await new Promise(r => {
                tx.objectStore("Vaults").get(set).onsuccess = e => {
                    const existing = e.target.result || [];
                    const idMap = new Map(existing.map(x => [x.id, x]));
                    batches[set].forEach(x => idMap.set(x.id, x));
                    tx.objectStore("Vaults").put(Array.from(idMap.values()), set).onsuccess = r;
                };
            });
        }
        
        alert(`BEAST MODE: ${successCount} ROWS INJECTED.`);
        refreshLib();
    }

    function nukeVault() {
        if (!currentVault) return alert("Select a vault first.");
        if (confirm(`PERMANENTLY DELETE [${currentVault}]?`)) {
            db.transaction(["Vaults"], "readwrite").objectStore("Vaults").delete(currentVault).onsuccess = () => {
                document.getElementById('data-input').value = "";
                currentVault = null;
                refreshLib();
            };
        }
    }

    // --- ACADEMIC JOURNAL PDF ENGINE (SCIENTIFIC) ---
    function generatePDF() {
        const raw = document.getElementById('data-input').value.trim();
        if(!raw) return alert("Workspace Empty");
        
        let lines = raw.split(/\r?\n/).filter(l => l.trim() !== "");
        let hIdx = lines.findIndex(l => l.toLowerCase().includes("id") && l.toLowerCase().includes("question"));
        if (hIdx === -1) { lines.unshift(R1_SCHEMA.join('\t')); hIdx = 0; }
        
        const data = lines.slice(1).map(l => {
            const c = l.split('\t'); 
            return R1_SCHEMA.reduce((acc, k, i) => {
                 let val = c[i] || "---";
                 return {...acc, [k.toLowerCase()]: val};
            }, {});
        });

        const win = window.open('', '_blank');
        const setID = currentVault || 'RESEARCH_DATA';
        const date = new Date().toLocaleDateString();

        const html = `
            <!DOCTYPE html>
            <html>
            <head>
                <title>ALCHEMIST | ${setID}</title>
                <style>
                    @import url('https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;700&display=swap');
                    @page { margin: 2cm; size: A4; }
                    body { font-family: 'Crimson Text', serif; line-height: 1.5; color: #111; max-width: 800px; margin: 0 auto; padding: 20px; }
                    .doc-header { border-bottom: 2px solid #000; padding-bottom: 10px; margin-bottom: 30px; display: flex; justify-content: space-between; align-items: flex-end; }
                    .doc-title { font-family: 'Inter', sans-serif; font-weight: 900; font-size: 24pt; text-transform: uppercase; letter-spacing: -1px; }
                    .doc-meta { font-family: 'Inter', sans-serif; font-size: 9pt; text-align: right; color: #555; }
                    .item { margin-bottom: 25px; padding-bottom: 20px; border-bottom: 1px solid #ddd; page-break-inside: avoid; }
                    .meta-strip { font-family: 'Inter', sans-serif; font-size: 7pt; text-transform: uppercase; color: #666; letter-spacing: 1px; margin-bottom: 5px; }
                    .tag { background: #eee; padding: 2px 5px; border-radius: 3px; margin-right: 5px; }
                    .q-block { font-size: 14pt; font-weight: 700; margin-bottom: 8px; color: #000; }
                    .ans-block { font-size: 11pt; margin-bottom: 8px; padding-left: 10px; border-left: 3px solid #000; }
                    .logic-block { font-size: 11pt; color: #333; background: #f9f9f9; padding: 10px; border-radius: 4px; }
                    sup { font-size: 0.7em; vertical-align: super; } sub { font-size: 0.7em; vertical-align: sub; }
                </style>
            </head>
            <body>
                <div class="doc-header">
                    <div class="doc-title">${setID}</div>
                    <div class="doc-meta">ALCHEMIST ENGINE v131.54<br>${data.length} RECORDS • ${date}</div>
                </div>
                ${data.map(d => `
                    <div class="item">
                        <div class="meta-strip"><span class="tag">${d.id}</span><span class="tag">${d.dom}</span><span>LVL ${d.level}</span></div>
                        <div class="q-block">${formatPrint(d.question)}</div>
                        <div class="ans-block"><span style="font-family:'Inter'; font-weight:700; font-size:9pt;">ANSWER:</span> ${d.ans === 'UP' ? formatPrint(d.up) : d.ans === 'RIGHT' ? formatPrint(d.right) : formatPrint(d.left)}</div>
                        <div class="logic-block"><span style="font-family:'Inter'; font-weight:700; font-size:9pt;">LOGIC:</span> ${formatPrint(d.expl)}</div>
                    </div>
                `).join('')}
            </body>
            </html>
        `;
        
        win.document.write(html);
        win.document.close();
        setTimeout(() => { win.focus(); win.print(); }, 800);
    }

    // Helper: Strip LaTeX for Print (Full Scientific)
    function formatPrint(t) {
        if(!t || t === "---") return "";
        return t.toString()
            .replace(/\\alpha/g, 'α').replace(/\\beta/g, 'β').replace(/\\gamma/g, 'γ')
            .replace(/\\Delta/g, 'Δ').replace(/\\times/g, '×').replace(/\\to/g, '→').replace(/\\circ/g, '°')
            .replace(/\^\{([^}]+)\}/g, '<sup>$1</sup>').replace(/_\{([^}]+)\}/g, '<sub>$1</sub>')
            .replace(/\^([0-9\+\-]+)/g, '<sup>$1</sup>').replace(/_([0-9]+)/g, '<sub>$1</sub>')
            .replace(/([A-Z][a-z]?)(\d+)/g, '$1<sub>$2</sub>'); // C6H12 -> C₆H₁₂
    }

    function exportData(type) {
        const raw = document.getElementById('data-input').value.trim();
        if(!raw) return alert("Workspace Empty");
        let lines = raw.split(/\r?\n/).filter(l => l.trim() !== "");
        let hIdx = lines.findIndex(l => l.toLowerCase().includes("id") && l.toLowerCase().includes("question"));
        if (hIdx === -1) { lines.unshift(R1_SCHEMA.join('\t')); hIdx = 0; }
        
        const data = lines.slice(1).map(l => {
            const c = l.split('\t'); 
            return R1_SCHEMA.reduce((acc, k, i) => {
                 let val = c[i] || "---"; return {...acc, [k.toLowerCase()]: val};
            }, {});
        });

        let content = "";
        if (type === 'js') content = "const EXPORT_DATA = " + JSON.stringify(data, null, 2);
        if (type === 'json') content = JSON.stringify(data, null, 2);
        if (type === 'tsv') content = raw;
        if (type === 'csv') content = R1_SCHEMA.join(",") + "\n" + data.map(r => R1_SCHEMA.map(k => `"${(r[k.toLowerCase()]||'').replace(/"/g,'""')}"`).join(",")).join("\n");

        const blob = new Blob([content], {type: "text/plain"});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `${currentVault || 'EXPORT'}.${type}`;
        a.click();
    }
</script>
</body>
</html>
