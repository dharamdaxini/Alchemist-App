<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>VIA.STACK | v131.85</title>

<link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,600;1,600&family=Inter:wght@400;700;900&family=JetBrains+Mono&display=swap" rel="stylesheet">

<style>
:root{
--bg:#000;--card:#111;--gold:#ffd600;--blue:#2979FF;--green:#2ecc71;
--font-chem:'Crimson Text',serif;--font-ui:'Inter',sans-serif;--font-code:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
body{margin:0;height:100vh;background:var(--bg);color:#fff;font-family:var(--font-ui);overflow:hidden;position:fixed;width:100%}

/* HUD */
#header{width:92%;margin:25px auto 10px;display:none}
.header-top{display:flex;justify-content:space-between;font-family:var(--font-code);font-size:.65rem;color:#555;text-transform:uppercase}
.progress-track{height:3px;background:#1a1a1a;margin-top:10px;border-radius:10px}
#progress-bar{height:100%;width:0%;background:var(--gold);transition:.3s}

/* STACK */
#stack{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
width:94%;max-width:420px;height:65vh;display:flex;align-items:center;justify-content:center}
.card{position:absolute;width:100%;height:100%;background:#0e0e0e;border-radius:40px;
border:1px solid #262626;padding:35px;display:flex;flex-direction:column;
justify-content:center;align-items:center;text-align:center;box-shadow:0 40px 100px rgba(0,0,0,.9)}
.card-q{font-family:var(--font-chem);font-size:1.5rem;line-height:1.4;font-weight:600}
.wiz-title{font-weight:900;font-size:2.2rem;text-transform:uppercase;letter-spacing:-1px}

/* SWIPE LABELS */
.swipe-label{position:absolute;inset:0;display:flex;flex-direction:column;
align-items:center;justify-content:center;background:rgba(0,0,0,.96);
opacity:0;border-radius:40px;transition:.1s;pointer-events:none}
.sl-badge{font-family:var(--font-code);font-size:.6rem;color:var(--gold);
border:1px solid var(--gold);padding:5px 12px;border-radius:100px;margin-bottom:15px}
.sl-text{font-weight:800;font-size:1.4rem;text-transform:uppercase}

/* OVERLAY */
#overlay{position:fixed;inset:0;background:#000;z-index:2000;
padding:40px;display:none;flex-direction:column}
.overlay-content{font-family:var(--font-chem);font-size:1.1rem;line-height:1.6;color:#ddd;flex:1;overflow-y:auto}
.label-block{color:var(--gold);font-size:.75rem;font-weight:900;text-transform:uppercase;
margin-top:20px;border-bottom:1px solid #222;padding-bottom:5px}
.btn-action{width:100%;padding:20px;background:var(--gold);border:none;
border-radius:12px;font-weight:900;margin-top:20px}

/* REPORT */
#report-screen{position:fixed;inset:0;background:#000;z-index:3000;
display:none;flex-direction:column;padding:30px;overflow-y:auto}
.report-card{background:#0a0a0a;border:1px solid #1a1a1a;
padding:25px;border-radius:20px;margin-bottom:25px}
textarea{width:100%;background:#0a0a0a;border:1px solid var(--blue);
color:#fff;padding:15px;border-radius:12px;height:100px;margin:15px 0;resize:none}

sup,sub{font-size:.6em}b{color:var(--gold)}
</style>
</head>

<body>

<div id="overlay">
  <div id="overlay-text" class="overlay-content"></div>
  <button class="btn-action" onclick="overlay.style.display='none'">RESUME</button>
</div>

<div id="report-screen">
  <div style="color:var(--gold);font-weight:900;font-size:1.5rem;margin-bottom:20px">ANALYSIS REPORT</div>
  <div id="report-body"></div>
  <span class="label-block">SYSTEM FEEDBACK</span>
  <textarea id="feedback-input" placeholder="Enter session observations..."></textarea>
  <button class="btn-action" onclick="submitAndLoop()">SUBMIT & LOOP</button>
</div>

<div id="header">
  <div class="header-top"><span id="sess-xp">0 XP</span><span id="log-vault">VAULT</span></div>
  <div class="progress-track"><div id="progress-bar"></div></div>
</div>

<div id="stack"></div>

<script>
const TELEMETRY_URL="https://script.google.com/macros/s/AKfycbzw-sTiiKTYqtnXJusEmxpx2Wv-8UG2VPdY29WOTSLwUold9LuTpBOv80aVmUAGDlIa6w/exec";
const ACTIVE_VAULT=sessionStorage.getItem("ACTIVE_VAULT");
if(!ACTIVE_VAULT)location.href="admin.html";

let db,VAULT=[],POOL=[],COMPLETED=[],SCORE=0,CONFIG={};

/* ---------- PHYSICS ENGINE (UNCHANGED) ---------- */
function bindPhysics(el,d,isWiz,q){
let x=0,y=0,sx=0,sy=0,active=false;
const start=(cx,cy)=>{active=true;sx=cx;sy=cy;el.style.transition="none"};
const move=(cx,cy)=>{
if(!active)return;x=cx-sx;y=cy-sy;
el.style.transform=`translate3d(${x}px,${y}px,0) rotate(${x/25}deg)`;
el.querySelectorAll('.swipe-label').forEach(l=>l.style.opacity=0);
if(Math.sqrt(x*x+y*y)>40){
const a=Math.atan2(-y,x)*(180/Math.PI);
const s=(a>=45&&a<135)?".sl-up":(a>=135||a<-135)?".sl-left":(a>=-135&&a<-45)?".sl-down":".sl-right";
const lab=el.querySelector(s);if(lab)lab.style.opacity=1;
}};
const end=()=>{
if(!active)return;active=false;
if(Math.sqrt(x*x+y*y)>100){
let dir=Math.abs(y)>Math.abs(x)?(y<0?"UP":"DOWN"):(x>0?"RIGHT":"LEFT");
if(isWiz){d.action(d[dir.toLowerCase()])}
else{
if(dir==="DOWN"){showDeepDive(q);return}
if(dir===q.ans)SCORE+=10;
COMPLETED.push(POOL.shift());renderSession();
}}el.style.transform="none"};
el.ontouchstart=e=>start(e.touches[0].clientX,e.touches[0].clientY);
window.ontouchmove=e=>move(e.touches[0].clientX,e.touches[0].clientY);
window.ontouchend=end;
el.onmousedown=e=>start(e.clientX,e.clientY);
window.onmousemove=e=>move(e.clientX,e.clientY);
window.onmouseup=end;
}

/* ---------- DATA ---------- */
indexedDB.open("AlchemistDB",1).onsuccess=e=>{
db=e.target.result;
db.transaction("Vaults").objectStore("Vaults").get(ACTIVE_VAULT).onsuccess=e=>{
VAULT=e.target.result?.data||e.target.result||[];
renderWizard(1);
};
};

/* ---------- WIZARD (5-LAYER FLOW) ---------- */
function renderWizard(step){
const s=stack;s.innerHTML="";
let d={};
if(step===1){
const doms=[...new Set(VAULT.map(i=>i.dom||"GENERAL"))].slice(0,4);
d={title:"SELECT DOMAIN",type:"4WAY",up:doms[0],right:doms[1],left:doms[2],down:doms[3],
action:c=>{CONFIG.dom=c;renderWizard(2)}};
}
else if(step===2){
d={title:"SELECT DEPTH",type:"2WAY",left:"BASICS",right:"DEEP DIVE",
action:c=>{CONFIG.depth=c==="BASICS"?"LOW":"HIGH";renderWizard(3)}};
}
else if(step===3){
d={title:"SESSION LOAD",type:"2WAY",left:"10 CARDS",right:"20 CARDS",
action:c=>{CONFIG.count=c.includes("10")?10:20;launchSession()}};
}
renderCardUI(d,true);
}

/* ---------- SESSION ---------- */
function launchSession(){
POOL=VAULT.filter(i=>(i.dom||"GENERAL")===CONFIG.dom);
if(CONFIG.depth==="LOW")POOL=POOL.filter(i=>!i.level||parseInt(i.level)<=2);
POOL=POOL.sort(()=>0.5-Math.random()).slice(0,CONFIG.count);
header.style.display="block";log_vault.innerText=ACTIVE_VAULT;
renderSession();
}

function renderSession(){
if(!POOL.length)return showReport();
progress_bar.style.width=`${(COMPLETED.length/CONFIG.count)*100}%`;
sess_xp.innerText=SCORE+" XP";
const q=POOL[0];
renderCardUI({title:fmt(q.question),type:"4WAY",
up:fmt(q.up),right:fmt(q.right),left:fmt(q.left),down:"DEEP DIVE"},false,q);
}

/* ---------- CARD ---------- */
function renderCardUI(d,isWiz,q){
stack.innerHTML="";
const c=document.createElement("div");c.className="card";
let o="";
if(d.type==="4WAY"){
if(d.up)o+=`<div class="swipe-label sl-up"><div class="sl-badge">▲</div><div class="sl-text">${d.up}</div></div>`;
if(d.right)o+=`<div class="swipe-label sl-right"><div class="sl-badge">▶</div><div class="sl-text">${d.right}</div></div>`;
if(d.left)o+=`<div class="swipe-label sl-left"><div class="sl-badge">◀</div><div class="sl-text">${d.left}</div></div>`;
o+=`<div class="swipe-label sl-down"><div class="sl-badge">▼</div><div class="sl-text">${isWiz?"": "DEEP DIVE"}</div></div>`;
}else{
o+=`<div class="swipe-label sl-left"><div class="sl-badge">◀</div><div class="sl-text">${d.left}</div></div>`;
o+=`<div class="swipe-label sl-right"><div class="sl-badge">▶</div><div class="sl-text">${d.right}</div></div>`;
}
c.innerHTML=`<div class="${isWiz?"wiz-title":"card-q"}">${d.title}</div>${o}`;
stack.appendChild(c);bindPhysics(c,d,isWiz,q);
}

/* ---------- OVERLAY ---------- */
function showDeepDive(d){
overlay_text.innerHTML=`<span class="label-block">Theoretical Logic</span>${fmt(d.expl)}
<span class="label-block">Hint</span>${fmt(d.context||d.hint)}`;
overlay.style.display="flex";
}

/* ---------- REPORT ---------- */
function showReport(){
header.style.display="none";stack.style.display="none";
report_body.innerHTML="";
COMPLETED.forEach(d=>{
const r=document.createElement("div");r.className="report-card";
r.innerHTML=`<div style="font-weight:900">${fmt(d.question)}</div>
<div style="color:var(--green);font-family:var(--font-code);font-size:.75rem">ANS: ${fmt(d[d.ans.toLowerCase()])}</div>
<span class="label-block">What to learn now</span>${fmt(d.step_1)}
<span class="label-block">What to learn next</span>${fmt(d.step_2)}`;
report_body.appendChild(r);
});
report_screen.style.display="flex";
}

function submitAndLoop(){
fetch(TELEMETRY_URL,{method:"POST",mode:"no-cors",
body:JSON.stringify({uid:"ANON",feedback:feedback_input.value})});
location.reload();
}

function fmt(t){
if(!t||t==="---")return "";
return t.toString().replace(/\$/g,'')
.replace(/Spin-Orbit Coupling/g,'<b>Spin-Orbit Coupling</b>')
.replace(/\^\{([^}]+)\}/g,'<sup>$1</sup>')
.replace(/_\{([^}]+)\}/g,'<sub>$1</sub>')
.replace(/\^([0-9\+\-]+)/g,'<sup>$1</sup>')
.replace(/_([0-9]+)/g,'<sub>$1</sub>');
}
</script>
</body>
</html>
