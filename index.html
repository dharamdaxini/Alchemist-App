<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VIA.STACK | STUDENT</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#000000">
    
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:wght@600&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #000; --gold: #ffd600; --blue: #2979FF; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; height: 100vh; overflow: hidden; position: fixed; width: 100%; touch-action: none; }
        
        #portal { padding: 30px; height: 100%; overflow-y: auto; }
        .tile { background: #111; border: 1px solid #333; border-radius: 12px; padding: 20px; margin-bottom: 10px; cursor: pointer; transition: 0.2s; }
        .tile:active { transform: scale(0.98); border-color: var(--gold); }
        
        #stack { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; z-index: 100; }
        .card { width: 90%; max-width: 400px; height: 60vh; background: #111; border: 1px solid #333; border-radius: 30px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px; font-family: 'Crimson Text', serif; font-size: 1.5rem; position: relative; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        
        .swipe-label { position: absolute; font-family: 'Inter', sans-serif; font-weight: 900; color: var(--gold); opacity: 0; font-size: 2rem; pointer-events: none; }
        
        #overlay { position: fixed; inset: 0; background: #000; z-index: 200; display: none; flex-direction: column; padding: 40px; justify-content: center; }
        
        /* SCIENCE FORMATTING */
        sup { font-size: 0.6em; vertical-align: super; }
        sub { font-size: 0.6em; vertical-align: sub; }
        b { color: var(--gold); }
    </style>
</head>
<body>

<div id="portal">
    <div style="color:var(--gold); font-weight:900; font-size:1.5rem; margin-bottom:20px;">VIA.STACK</div>
    <div id="library"></div>
</div>

<div id="stack"></div>

<div id="overlay">
    <div id="overlay-text" style="line-height:1.6; color:#ddd; font-family:'Crimson Text', serif; font-size:1.2rem;"></div>
    <button onclick="closeOverlay()" style="padding:15px; background:var(--gold); border:none; border-radius:8px; font-weight:900; margin-top:20px;">RESUME</button>
</div>

<script>
    // --- TELEMETRY CONFIGURATION ---
    const TELEMETRY_URL = "https://script.google.com/macros/s/AKfycbzw-sTiiKTYqtnXJusEmxpx2Wv-8UG2VPdY29WOTSLwUold9LuTpBOv80aVmUAGDlIa6w/exec";
    const USER_ID = "STUDENT_" + Math.random().toString(36).substr(2, 9).toUpperCase();

    let db, POOL = [];
    const request = indexedDB.open("AlchemistDB", 1);
    request.onsuccess = e => { db = e.target.result; loadLibrary(); };

    // --- TELEMETRY SENDER ---
    function logEvent(action, payload) {
        if (!TELEMETRY_URL) return;
        fetch(TELEMETRY_URL, {
            method: "POST", mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ 
                uid: USER_ID, 
                action: action, 
                payload: payload, 
                ua: navigator.userAgent 
            })
        }).catch(err => console.log("Log fail"));
    }

    function loadLibrary() {
        const lib = document.getElementById('library'); lib.innerHTML = "";
        db.transaction(["Vaults"], "readonly").objectStore("Vaults").openCursor().onsuccess = e => {
            const c = e.target.result;
            if(c) {
                const div = document.createElement('div'); div.className = "tile";
                div.innerHTML = `<strong>${c.key}</strong><br><small style="color:#666">${c.value.length} CARDS</small>`;
                div.onclick = () => startSession(c.key);
                lib.appendChild(div);
                c.continue();
            }
        };
    }

    function startSession(key) {
        db.transaction(["Vaults"]).objectStore("Vaults").get(key).onsuccess = e => {
            POOL = (e.target.result || []).sort(() => Math.random() - 0.5);
            if(!POOL.length) return alert("Empty");
            document.getElementById('portal').style.display = 'none';
            document.getElementById('stack').style.display = 'flex';
            
            logEvent("SESSION_START", `Vault: ${key}`);
            renderCard();
        };
    }

    function renderCard() {
        const s = document.getElementById('stack'); s.innerHTML = "";
        if(!POOL.length) {
            logEvent("SESSION_COMPLETE", "All cards finished");
            return location.reload();
        }
        
        const q = POOL[0];
        const c = document.createElement('div'); c.className = "card";
        c.innerHTML = `<div>${fmt(q.question)}</div><div class="swipe-label">SWIPE</div>`;
        s.appendChild(c);
        
        // PHYSICS ENGINE
        let startX = 0, startY = 0;
        c.addEventListener('touchstart', e => { startX = e.touches[0].clientX; startY = e.touches[0].clientY; });
        c.addEventListener('touchmove', e => {
            let dx = e.touches[0].clientX - startX;
            let dy = e.touches[0].clientY - startY;
            c.style.transform = `translate(${dx}px, ${dy}px) rotate(${dx/10}deg)`;
            if(Math.abs(dy) > 50 && dy > 0) { c.querySelector('.swipe-label').innerText = "DEEP DIVE"; c.querySelector('.swipe-label').style.opacity = 1; }
            else if(Math.abs(dx) > 50) { c.querySelector('.swipe-label').innerText = dx > 0 ? "RIGHT" : "LEFT"; c.querySelector('.swipe-label').style.opacity = 1; }
        });
        
        c.addEventListener('touchend', e => {
             let dx = e.changedTouches[0].clientX - startX;
             let dy = e.changedTouches[0].clientY - startY;
             
             // DEEP DIVE (Swipe Down)
             if(dy > 100) { 
                 showOverlay(q); 
             } 
             // ANSWER (Swipe Left/Right)
             else if(Math.abs(dx) > 100) { 
                 const dir = dx > 0 ? "RIGHT" : "LEFT";
                 // Simple logging of choice vs correct answer
                 const isCorrect = dir === (q.ans || "UP").toUpperCase();
                 logEvent(isCorrect ? "CORRECT" : "WRONG", `Q: ${q.id} | Choice: ${dir}`);
                 
                 POOL.shift(); 
                 renderCard(); 
             }
             // SNAP BACK
             else { 
                 c.style.transform = ""; 
                 c.querySelector('.swipe-label').style.opacity = 0; 
             }
        });
    }

    function showOverlay(d) {
        logEvent("DEEP_DIVE", `Q: ${d.id}`);
        let html = `<strong>LOGIC:</strong> ${fmt(d.expl)}<br><br>`;
        if(d.step_1 && d.step_1 !== "---") html += `<strong>STEP 1:</strong> ${fmt(d.step_1)}<br>`;
        document.getElementById('overlay-text').innerHTML = html;
        document.getElementById('overlay').style.display = 'flex';
    }
    
    function closeOverlay() { 
        document.getElementById('overlay').style.display = 'none'; 
        POOL.shift(); 
        renderCard(); 
    }

    // --- HEAVY DUTY TEXT PROCESSOR (FIXES THE CHEMISTRY) ---
    function fmt(t) { 
        if(!t) return "";
        let txt = t.toString();
        
        // 1. Remove LaTeX $ signs
        txt = txt.replace(/\$/g, '');

        // 2. Fix Markdown Bold (**text**)
        txt = txt.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');

        // 3. Fix Subscripts (H_2O, _2, _{2})
        txt = txt.replace(/_\{([^}]+)\}/g, '<sub>$1</sub>');
        txt = txt.replace(/_([0-9]+)/g, '<sub>$1</sub>');

        // 4. Fix Superscripts (^2, ^+, ^{+})
        txt = txt.replace(/\^\{([^}]+)\}/g, '<sup>$1</sup>');
        txt = txt.replace(/\^([0-9\+\-]+)/g, '<sup>$1</sup>');

        // 5. Greek
        txt = txt.replace(/\\alpha/g, 'α').replace(/\\beta/g, 'β').replace(/\\Delta/g, 'Δ');

        return txt;
    }
</script>
</body>
</html>
