<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>VIA.STACK | KINETIC ENGINE v131.20</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;900&family=JetBrains+Mono&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#000;
  --card:#0c0c0c;
  --gold:#ffd600;
  --text:#eaeaea;
  --muted:#666;
  --accent:#2979ff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',sans-serif;
  height:100vh;
  overflow:hidden;
}

/* ─── HUD ───────────────────────── */
#hud{
  position:fixed;
  top:0; left:0; right:0;
  padding:14px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  z-index:100;
  background:linear-gradient(#000, transparent);
}
#xp{ color:var(--gold); font-weight:900; }
#calcBtn{
  border:1px solid var(--gold);
  padding:6px 12px;
  border-radius:20px;
  font-size:.7rem;
  cursor:pointer;
}

/* ─── META FEED ─────────────────── */
#meta{
  position:fixed;
  top:70px;
  right:14px;
  font-family:'JetBrains Mono',monospace;
  font-size:.6rem;
  color:#444;
  text-align:right;
  line-height:1.5;
}

/* ─── CARD STACK ────────────────── */
#stack{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
}
.card{
  position:absolute;
  width:88%;
  max-width:420px;
  background:var(--card);
  border-radius:22px;
  padding:26px;
  box-shadow:0 20px 50px rgba(0,0,0,.6);
  touch-action:none;
  transition:transform .35s cubic-bezier(.22,.61,.36,1);
}
.q{
  font-size:1.05rem;
  font-weight:700;
}
.opt{
  margin-top:18px;
  padding:14px;
  border-radius:14px;
  background:#111;
  font-size:.85rem;
}

/* ─── LOGIC OVERLAY ─────────────── */
#logic{
  position:fixed;
  inset:0;
  background:#000;
  z-index:200;
  display:none;
  padding:30px;
}
#logic h3{color:var(--gold)}
#logic p{font-family:'JetBrains Mono',monospace;font-size:.75rem;color:#ccc}

/* ─── ZERO STATE ────────────────── */
#zero{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
}
#zero button{
  margin-top:20px;
  padding:14px 28px;
  border-radius:30px;
  border:none;
  background:var(--gold);
  font-weight:900;
}
</style>
</head>

<body>

<!-- HUD -->
<div id="hud">
  <div id="xp">XP 000</div>
  <div id="calcBtn">CALC</div>
</div>

<!-- META -->
<div id="meta">
  VAULT: <span id="mVault">UNSET</span><br>
  DOMAIN: CORE<br>
  LEVEL: 01
</div>

<!-- CARD STACK -->
<div id="stack"></div>

<!-- LOGIC OVERLAY -->
<div id="logic">
  <h3>THEORETICAL LOGIC</h3>
  <p id="logicText"></p>
</div>

<!-- ZERO STATE -->
<div id="zero" style="display:none">
  <div>
    <h2>No Active Vault</h2>
    <p class="muted">Restore protocol required</p>
    <button onclick="location.href='admin.html'">OPEN REGISTRY</button>
  </div>
</div>

<script>
/* ─── SESSION HANDSHAKE ─────────── */
const vault = sessionStorage.getItem("ACTIVE_VAULT");
document.getElementById("mVault").innerText = vault || "UNSET";

if(!vault){
  document.getElementById("zero").style.display="flex";
  throw "NO_VAULT";
}

/* ─── SAMPLE DATA (replace with DB) */
const DATA=[
 {q:"What is the molar mass of H₂O?",opts:["18 g","16 g","20 g"],logic:"2×1 + 16 = 18"},
 {q:"Avogadro constant equals?",opts:["6.022×10²³","3.14","1.6×10⁻¹⁹"],logic:"Particles per mole"}
];

let index=0;

/* ─── FORMULA SANITIZER ─────────── */
function render(txt){
 return txt
 .replace(/_(\d+)/g,"<sub>$1</sub>")
 .replace(/\^(\{.*?\})/g,"<sup>$1</sup>");
}

/* ─── CARD BUILDER ─────────────── */
function build(){
  const d=DATA[index];
  const c=document.createElement("div");
  c.className="card";
  c.innerHTML=`<div class="q">${render(d.q)}</div>
    ${d.opts.map(o=>`<div class="opt">${render(o)}</div>`).join("")}`;
  enableSwipe(c,d.logic);
  document.getElementById("stack").appendChild(c);
}

/* ─── PHYSICS SWIPE ─────────────── */
function enableSwipe(card,logic){
 let sx=0,dx=0;
 card.addEventListener("pointerdown",e=>{
   sx=e.clientX;
   card.setPointerCapture(e.pointerId);
 });
 card.addEventListener("pointermove",e=>{
   dx=e.clientX-sx;
   card.style.transform=`translateX(${dx}px) rotate(${dx/18}deg)`;
 });
 card.addEventListener("pointerup",()=>{
   if(Math.abs(dx)>100){
     card.remove();
     index++;
     build();
   }else{
     card.style.transform="";
   }
 });
 card.addEventListener("pointerdown",e=>{
   if(e.clientY<120){
     showLogic(logic);
   }
 });
}

/* ─── LOGIC OVERLAY ─────────────── */
function showLogic(t){
 document.getElementById("logicText").innerText=t;
 document.getElementById("logic").style.display="block";
 setTimeout(()=>document.getElementById("logic").style.display="none",2500);
}

/* INIT */
build();
</script>
</body>
</html>
