<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>VIA.STACK | KINETIC ENGINE v133.40</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;900&family=JetBrains+Mono&display=swap" rel="stylesheet">

<style>
:root{ --bg:#000; --card:#0e0e0e; --gold:#ffd600; --text:#eaeaea; --green:#00e676; --red:#ff4757; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
body{ margin:0; background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; height:100vh; overflow:hidden; display:flex; flex-direction:column; }

/* ─── HUD ───────────────────────── */
#hud{ position:fixed; top:0; left:0; right:0; padding:15px 20px; display:flex; justify-content:space-between; align-items:center; z-index:100; background:linear-gradient(180deg, #000 0%, transparent 100%); }
#xp{ color:var(--gold); font-weight:900; letter-spacing:1px; font-size:0.9rem; }
.pill-btn { border:1px solid #333; background:#111; color:#888; padding:6px 14px; border-radius:20px; font-size:.65rem; font-weight:700; cursor:pointer; }

/* ─── META FEED ─────────────────── */
#meta{ position:fixed; top:60px; right:20px; font-family:'JetBrains Mono',monospace; font-size:.6rem; color:#444; text-align:right; line-height:1.4; pointer-events:none; }

/* ─── CARD STACK ────────────────── */
#stack{ flex:1; position:relative; display:flex; align-items:center; justify-content:center; perspective:1000px; overflow:hidden; }
.card{
  position:absolute; width:90%; max-width:400px; height:65vh; max-height:500px;
  background:var(--card); border:1px solid #222; border-radius:24px; padding:30px;
  box-shadow:0 30px 80px rgba(0,0,0,.8); transform-origin:50% 100%;
  display:flex; flex-direction:column; justify-content:center;
  will-change:transform; touch-action:none;
}
.card-header { font-family:'JetBrains Mono'; font-size:0.6rem; color:var(--gold); margin-bottom:15px; text-transform:uppercase; letter-spacing:1px; }
.q { font-size:1.4rem; font-weight:800; line-height:1.3; color:#fff; flex:1; display:flex; align-items:center; }
.opt-grid { display:grid; gap:10px; margin-top:20px; }
.opt { padding:16px; border-radius:12px; background:#161616; border:1px solid #222; font-size:.8rem; font-weight:600; color:#aaa; text-align:center; transition:0.2s; }
.opt.correct { border-color:var(--green); color:var(--green); background:rgba(0,230,118,0.1); }
.opt.wrong { border-color:var(--red); color:var(--red); opacity:0.5; }

/* ─── LOGIC OVERLAY ─────────────── */
#logic{ position:fixed; bottom:0; left:0; right:0; background:#111; z-index:200; transform:translateY(100%); transition:transform 0.3s cubic-bezier(0.16, 1, 0.3, 1); padding:30px 30px 50px 30px; border-radius:24px 24px 0 0; border-top:1px solid #333; }
#logic.active { transform:translateY(0); }
.logic-tag { color:var(--gold); font-size:0.65rem; font-weight:900; letter-spacing:1px; margin-bottom:10px; display:block; }
.logic-body { font-family:'JetBrains Mono'; font-size:0.8rem; color:#ccc; line-height:1.6; }

/* ─── ZERO STATE ────────────────── */
#zero{ position:absolute; inset:0; background:#000; z-index:500; display:none; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
.zero-btn { margin-top:20px; padding:16px 32px; border-radius:40px; border:none; background:var(--gold); color:#000; font-weight:900; font-size:0.9rem; cursor:pointer; }

/* ─── PHYSICS HINTS ─────────────── */
.swipe-hint { position:absolute; top:20px; font-weight:900; font-size:1.5rem; opacity:0; transition:0.1s; z-index:10; pointer-events:none; }
.sh-right { right:20px; color:var(--green); transform:rotate(15deg); }
.sh-left { left:20px; color:var(--red); transform:rotate(-15deg); }

</style>
</head>

<body>

<div id="hud">
  <div id="xp">XP 0</div>
  <div class="pill-btn" onclick="location.href='admin.html'">ADMIN</div>
</div>

<div id="meta">
  DB: <span id="db-status">CONNECTING...</span><br>
  IDX: <span id="card-idx">0</span>
</div>

<div id="stack"></div>

<div id="logic" onclick="this.classList.remove('active')">
  <span class="logic-tag">SYSTEM LOGIC // TAP TO CLOSE</span>
  <div class="logic-body" id="logicText"></div>
</div>

<div id="zero">
  <h2 style="color:#333; font-size:2rem; margin:0;">NO SIGNAL</h2>
  <p style="color:#666; font-family:'JetBrains Mono'; font-size:0.7rem; margin-top:10px;">DATABASE DISCONNECTED OR EMPTY</p>
  <button class="zero-btn" onclick="location.href='admin.html'">LAUNCH ADMIN CONSOLE</button>
</div>

<script>
// --- CONFIG ---
const DB_KEY = 'ALCHEMIST_MASTER_DB'; // Must match Admin Console
const USER_KEY = 'VIA_USER_XP';

let POOL = [];
let INDEX = 0;
let XP = parseInt(localStorage.getItem(USER_KEY) || 0);
document.getElementById('xp').innerText = `XP ${XP}`;

// --- BOOT SEQUENCE ---
window.onload = () => {
    const raw = localStorage.getItem(DB_KEY);
    if(!raw) return triggerZeroState();
    
    try {
        POOL = JSON.parse(raw);
        if(!Array.isArray(POOL) || POOL.length === 0) throw "EMPTY";
        
        // Shuffle for randomness
        POOL.sort(() => Math.random() - 0.5);
        
        document.getElementById('db-status').innerText = "LIVE";
        document.getElementById('db-status').style.color = "#00e676";
        renderCard();
    } catch(e) {
        triggerZeroState();
    }
};

function triggerZeroState() {
    document.getElementById('zero').style.display = 'flex';
}

// --- RENDER ENGINE ---
function renderCard() {
    if(INDEX >= POOL.length) return alert("SESSION COMPLETE. REFRESH TO RESTART.");
    
    const data = POOL[INDEX];
    document.getElementById('card-idx').innerText = `#${data.id || INDEX+1}`;
    
    const stack = document.getElementById('stack');
    stack.innerHTML = ''; // Clean slate
    
    const card = document.createElement('div');
    card.className = 'card';
    
    // Auto-detect if Data is Question (Edu) or Product (Affiliate)
    // Fallback logic for generic display
    const title = data.q || data.product_name || "UNKNOWN DATA UNIT";
    const logic = data.logic || data.description || "No Data.";
    
    // Construct Options (Randomized order for Edu)
    let options = [];
    if(data.u) options.push({ txt: data.u, correct: (data.correct === data.u) });
    if(data.r) options.push({ txt: data.r, correct: (data.correct === data.r) });
    if(data.l) options.push({ txt: data.l, correct: (data.correct === data.l) });
    
    // Pivot: If no options (Affiliate Mode), show Price/Buy
    if(options.length === 0 && data.price) {
        options.push({ txt: `BUY @ ${data.price}`, correct: true }); // Affiliate Link logic here
    }

    card.innerHTML = `
        <div class="card-header">${data.dom || 'GENERAL'} // ${data.level || '1'}</div>
        <div class="q">${fmt(title)}</div>
        <div class="opt-grid">
            ${options.map(o => `<div class="opt" onclick="handleOpt(this, ${o.correct}, '${logic.replace(/'/g, "\\'")}')">${fmt(o.txt)}</div>`).join('')}
        </div>
        <div class="swipe-hint sh-right">NEXT</div>
        <div class="swipe-hint sh-left">SKIP</div>
    `;

    bindPhysics(card);
    stack.appendChild(card);
}

// --- INTERACTION ---
function handleOpt(el, isCorrect, logicText) {
    if(el.parentElement.classList.contains('locked')) return;
    el.parentElement.classList.add('locked'); // Lock inputs
    
    if(isCorrect) {
        el.classList.add('correct');
        XP += 10;
        localStorage.setItem(USER_KEY, XP);
        document.getElementById('xp').innerText = `XP ${XP}`;
        setTimeout(() => swipeCard('RIGHT'), 600);
    } else {
        el.classList.add('wrong');
        // Reveal correct
        Array.from(el.parentElement.children).forEach(child => {
             // Basic text matching for fallback correction highlight
             // ideally pass ID, but for now we rely on visual feedback
        });
        showLogic(logicText);
    }
}

function showLogic(text) {
    document.getElementById('logicText').innerHTML = fmt(text);
    document.getElementById('logic').classList.add('active');
}

// --- PHYSICS ENGINE (SWIPE) ---
function bindPhysics(el) {
    let startX = 0, currentX = 0;
    let isDragging = false;

    el.addEventListener('touchstart', e => {
        startX = e.touches[0].clientX;
        isDragging = true;
        el.style.transition = 'none';
    });

    el.addEventListener('touchmove', e => {
        if(!isDragging) return;
        currentX = e.touches[0].clientX - startX;
        el.style.transform = `translateX(${currentX}px) rotate(${currentX * 0.05}deg)`;
        
        // Opacity Hints
        el.querySelector('.sh-right').style.opacity = currentX > 50 ? currentX/200 : 0;
        el.querySelector('.sh-left').style.opacity = currentX < -50 ? Math.abs(currentX)/200 : 0;
    });

    el.addEventListener('touchend', e => {
        isDragging = false;
        el.style.transition = 'transform 0.3s ease';
        
        if(currentX > 120) swipeCard('RIGHT');
        else if(currentX < -120) swipeCard('LEFT');
        else {
            el.style.transform = 'translateX(0) rotate(0)';
            el.querySelectorAll('.swipe-hint').forEach(h => h.style.opacity = 0);
        }
    });
}

function swipeCard(dir) {
    const el = document.querySelector('.card');
    if(!el) return;
    
    const x = dir === 'RIGHT' ? window.innerWidth : -window.innerWidth;
    el.style.transform = `translateX(${x}px) rotate(${x * 0.05}deg)`;
    
    setTimeout(() => {
        INDEX++;
        document.getElementById('logic').classList.remove('active');
        renderCard();
    }, 300);
}

// --- TEXT FORMATTER ---
function fmt(text) {
    if(!text) return "";
    return text.toString()
        .replace(/\^(\d+)/g, "<sup>$1</sup>")
        .replace(/_(\d+)/g, "<sub>$1</sub>");
}
</script>
</body>
</html>
