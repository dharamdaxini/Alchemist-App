<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VIA.STACK | STUDENT TERMINAL</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">

    <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,600;1,600&family=Inter:wght@400;700;900&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #000; --card: #0a0a0a; --gold: #ffd600; --blue: #2979FF; --green: #2ecc71; --red: #ff4444; --font-chem: 'Crimson Text', serif; --font-ui: 'Inter', sans-serif; --font-code: 'JetBrains Mono', monospace; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; user-select: none; }
        body { margin: 0; height: 100vh; background: var(--bg); color: #fff; font-family: var(--font-ui); overflow: hidden; position: fixed; width: 100%; touch-action: none; }
        
        /* --- HUD --- */
        #header { width: 92%; margin: 25px auto 10px; z-index: 1000; display: none; }
        .header-top { display: flex; justify-content: space-between; align-items: center; font-family: var(--font-code); font-size: 0.7rem; color: #555; }
        .progress-track { width: 100%; height: 3px; background: #1a1a1a; margin-top: 10px; border-radius: 10px; }
        #progress-bar { height: 100%; background: var(--gold); width: 0%; transition: 0.3s; }

        /* --- UNIFIED CARD STACK --- */
        #stack { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 94%; max-width: 420px; height: 65vh; display: flex; align-items: center; justify-content: center; z-index: 500; }
        .card { 
            position: absolute; width: 100%; height: 100%; 
            background: var(--card); border-radius: 40px; border: 1px solid #1a1a1a; 
            padding: 35px; display: flex; flex-direction: column; justify-content: center; 
            align-items: center; text-align: center; box-shadow: 0 40px 100px rgba(0,0,0,0.9); 
            overflow: hidden; transform-origin: 50% 100%;
        }

        .card-q { font-family: var(--font-chem); font-size: clamp(22px, 5vmin, 28px); line-height: 1.3; color: #eee; font-weight: 600; z-index: 2; }
        .wiz-meta { font-family: var(--font-code); color: #555; font-size: 0.65rem; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 25px; border: 1px solid #333; padding: 5px 12px; border-radius: 100px; }
        .wiz-title { font-family: 'Inter', sans-serif; font-weight: 900; font-size: 2.2rem; color: #fff; text-transform: uppercase; letter-spacing: -1px; line-height: 1; }

        /* --- COMPASS LABELS --- */
        .swipe-label { 
            position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; 
            background: rgba(0,0,0,0.96); color: #fff; opacity: 0; pointer-events: none; 
            border-radius: 40px; transition: opacity 0.1s; z-index: 10;
        }
        .sl-badge { font-family: var(--font-code); font-size: 0.6rem; color: var(--gold); border: 1px solid var(--gold); padding: 6px 12px; border-radius: 100px; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 2px; font-weight: 700; background: rgba(255, 214, 0, 0.1); }
        .sl-text { font-family: 'Inter', sans-serif; font-weight: 800; font-size: 1.5rem; text-transform: uppercase; color: #fff; }

        /* --- OVERLAY & REPORT --- */
        #overlay { position: fixed; inset: 0; background: #000; z-index: 2000; padding: 40px; display: none; flex-direction: column; }
        .overlay-content { font-family: var(--font-chem); font-size: 1.1rem; color: #ddd; overflow-y: auto; flex: 1; margin-bottom: 20px; line-height: 1.6; }
        .btn-resume { padding: 20px; background: var(--gold); color: #000; border: none; border-radius: 12px; font-weight: 900; font-family: var(--font-ui); text-transform: uppercase; cursor: pointer; }
        strong { color: var(--gold); font-family: var(--font-ui); font-size: 0.8rem; letter-spacing: 1px; text-transform: uppercase; display: block; margin-top: 20px; margin-bottom: 5px; }
        
        #report-screen { position: fixed; inset: 0; background: #000; z-index: 2000; display: none; flex-direction: column; padding: 30px; overflow-y: auto; touch-action: pan-y; }
        .report-header { color: var(--gold); font-weight: 900; font-size: 1.5rem; margin-bottom: 20px; text-transform: uppercase; border-bottom: 1px solid #222; padding-bottom: 10px; }
        .report-item { margin-bottom: 40px; border-bottom: 1px solid #1a1a1a; padding-bottom: 20px; }
        .rep-text { font-family: var(--font-chem); color: #bbb; line-height: 1.5; font-size: 1rem; }

        sup { font-size: 0.6em; vertical-align: super; } sub { font-size: 0.6em; vertical-align: sub; } b { color: var(--gold); }
    </style>
</head>
<body>

<div id="report-screen">
    <div class="report-header">Session Report</div>
    <div id="report-body"></div>
    <button class="btn-resume" onclick="location.reload()" style="margin-top:20px; width:100%;">New Session</button>
</div>

<div id="overlay">
    <div id="overlay-text" class="overlay-content"></div>
    <button class="btn-resume" onclick="closeOverlay()">RESUME</button>
</div>

<div id="header">
    <div class="header-top"><span id="sess-xp">0 XP</span><span id="log-vault">VAULT</span></div>
    <div class="progress-track"><div id="progress-bar"></div></div>
</div>

<div id="stack"></div>

<script>
    const TELEMETRY_URL = "https://script.google.com/macros/s/AKfycbzw-sTiiKTYqtnXJusEmxpx2Wv-8UG2VPdY29WOTSLwUold9LuTpBOv80aVmUAGDlIa6w/exec";
    const USER_ID = "STUDENT_" + Math.random().toString(36).substr(2, 9).toUpperCase();

    let db, FULL_DB = [], POOL = [], COMPLETED = [], SCORE = 0, INDEX = 1, CONFIG = {};
    
    const request = indexedDB.open("AlchemistDB", 1);
    request.onupgradeneeded = e => { e.target.result.createObjectStore("Vaults"); };
    request.onsuccess = e => { db = e.target.result; loadDatabase(); };

    function loadDatabase() {
        const tx = db.transaction(["Vaults"], "readonly");
        FULL_DB = [];
        tx.objectStore("Vaults").openCursor().onsuccess = e => {
            const cursor = e.target.result;
            if (cursor) {
                cursor.value.forEach(item => FULL_DB.push({...item, _originSet: cursor.key}));
                cursor.continue();
            } else { renderWizardStep(1); }
        };
    }

    function renderWizardStep(step) {
        const s = document.getElementById('stack'); s.innerHTML = "";
        let d = {};

        if (step === 1) { 
            const sets = [...new Set(FULL_DB.map(i => i.set || i._originSet))].slice(0, 4);
            d = { title: "CORE TOPIC", sub: "LAYER 1/5", type: "4WAY", up: sets[0], right: sets[1], left: sets[2], down: sets[3], action: (c) => { CONFIG.set = c; renderWizardStep(2); }};
        } else if (step === 2) { 
            const pool = FULL_DB.filter(i => (i.set || i._originSet) === CONFIG.set);
            const doms = [...new Set(pool.map(i => i.dom || "GENERAL"))].slice(0, 4);
            d = { title: "SELECT DOMAIN", sub: "LAYER 2/5", type: "4WAY", up: doms[0], right: doms[1], left: doms[2], down: doms[3], action: (c) => { CONFIG.dom = c; renderWizardStep(3); }};
        } else if (step === 3) { 
            let l = "BASICS", r = "DEEP DIVE";
            if(CONFIG.set && CONFIG.set.toUpperCase().includes("FUNDAMENTAL")) { l = "CONCEPTS"; r = "APPLICATION"; }
            d = { title: "SELECT DEPTH", sub: "LAYER 3/5", type: "2WAY", left: l, right: r, action: (c) => { CONFIG.depth = (c===l)?"LOW":"HIGH"; renderWizardStep(4); }};
        } else if (step === 4) { 
            d = { title: "LOAD SIZE", sub: "LAYER 4/5", type: "2WAY", left: "10 CARDS", right: "20 CARDS", action: (c) => { CONFIG.count = (c.includes("10"))?10:20; renderWizardStep(5); }};
        } else if (step === 5) { 
            d = { title: "SELECT MODE", sub: "LAYER 5/5", type: "2WAY", left: "TRAINING", right: "EXAM", action: (c) => { CONFIG.mode = (c==="TRAINING")?"TRAIN":"EXAM"; launchSession(); }};
        }
        renderCardUI(d, true);
    }

    function launchSession() {
        let finalPool = FULL_DB.filter(i => (i.set || i._originSet) === CONFIG.set);
        finalPool = finalPool.filter(i => (i.dom || "GENERAL") === CONFIG.dom);
        if (CONFIG.depth === "LOW") finalPool = finalPool.filter(i => (!i.level || parseInt(i.level) <= 2));
        else finalPool = finalPool.filter(i => (parseInt(i.level) >= 3));

        POOL = finalPool.sort(() => 0.5 - Math.random()).slice(0, CONFIG.count);
        document.getElementById('header').style.display = 'block';
        document.getElementById('log-vault').innerText = CONFIG.set;
        SCORE = 0; INDEX = 1; renderSessionCard();
    }

    function renderSessionCard() {
        const s = document.getElementById('stack'); s.innerHTML = "";
        if (!POOL.length) return showReport();
        const q = POOL[0];
        document.getElementById('progress-bar').style.width = `${(COMPLETED.length/CONFIG.count)*100}%`;
        document.getElementById('sess-xp').innerText = `${SCORE} XP`;

        const d = { title: fmt(q.question), sub: "QUESTION " + INDEX, type: "4WAY", up: fmt(q.up), right: fmt(q.right), left: fmt(q.left), down: "DEEP DIVE" };
        renderCardUI(d, false, q);
    }

    function renderCardUI(d, isWizard, qData) {
        const s = document.getElementById('stack'); s.innerHTML = "";
        const c = document.createElement('div'); c.className = "card";
        let overlays = "";
        if(d.type === "4WAY") {
             if(d.up) overlays += `<div class="swipe-label sl-up"><span class="sl-badge">▲ ${isWizard?"SELECT":"OPTION 1"}</span><span class="sl-text">${d.up}</span></div>`;
             if(d.right) overlays += `<div class="swipe-label sl-right"><span class="sl-badge">▶ ${isWizard?"SELECT":"OPTION 2"}</span><span class="sl-text">${d.right}</span></div>`;
             if(d.left) overlays += `<div class="swipe-label sl-left"><span class="sl-badge">◀ ${isWizard?"SELECT":"OPTION 3"}</span><span class="sl-text">${d.left}</span></div>`;
             if(d.down) overlays += `<div class="swipe-label sl-down"><span class="sl-badge">▼ ${isWizard?"SELECT":"DEEP DIVE"}</span><span class="sl-text">${d.down}</span></div>`;
        } else {
             overlays += `<div class="swipe-label sl-left"><span class="sl-badge">◀ SELECT</span><span class="sl-text">${d.left}</span></div>`;
             overlays += `<div class="swipe-label sl-right"><span class="sl-badge">▶ SELECT</span><span class="sl-text">${d.right}</span></div>`;
        }
        c.innerHTML = isWizard ? `<div class="wiz-meta">${d.sub}</div><div class="wiz-title">${d.title}</div>${overlays}` : `<div class="card-q">${d.title}</div>${overlays}`;
        s.appendChild(c); bindPhysics(c, d, isWizard, qData);
    }

    function bindPhysics(el, uiData, isWizard, qData) {
        let x=0, y=0, sx=0, sy=0, active=false;
        el.ontouchstart = e => { active=true; sx=e.touches[0].clientX; sy=e.touches[0].clientY; el.style.transition="none"; };
        el.onmousedown = e => { active=true; sx=e.clientX; sy=e.clientY; el.style.transition="none"; };
        const move = (cx, cy) => {
            if (!active) return;
            x = cx-sx; y = cy-sy; 
            requestAnimationFrame(() => { if(active) el.style.transform = `translate3d(${x}px,${y}px,0) rotate(${x/25}deg)`; });
            el.querySelectorAll('.swipe-label').forEach(l => l.style.opacity = 0);
            const dist = Math.sqrt(x*x+y*y);
            if(dist > 40) {
                if(uiData.type === "2WAY") { if(Math.abs(x) > Math.abs(y)) el.querySelector(x > 0 ? ".sl-right" : ".sl-left").style.opacity = 1; }
                else {
                    const ang = Math.atan2(-y, x)*(180/Math.PI);
                    let d = (ang >= 45 && ang < 135) ? ".sl-up" : (ang >= 135 || ang < -135) ? ".sl-left" : (ang >= -135 && ang < -45) ? ".sl-down" : ".sl-right";
                    if(el.querySelector(d)) el.querySelector(d).style.opacity = 1;
                }
            }
        };
        window.ontouchmove = e => move(e.touches[0].clientX, e.touches[0].clientY);
        window.onmousemove = e => move(e.clientX, e.clientY);
        window.ontouchend = window.onmouseup = () => {
            if(!active) return; active=false;
            if(Math.sqrt(x*x+y*y) > 100) {
                let dir = Math.abs(y) > Math.abs(x) ? (y < 0 ? "UP" : "DOWN") : (x > 0 ? "RIGHT" : "LEFT");
                if(isWizard) {
                    if(uiData.type === "2WAY" && (dir === "UP" || dir === "DOWN")) { el.style.transition="0.3s"; el.style.transform="none"; return; }
                    if(dir==="UP" && uiData.up) uiData.action(uiData.up);
                    if(dir==="DOWN" && uiData.down) uiData.action(uiData.down);
                    if(dir==="RIGHT" && uiData.right) uiData.action(uiData.right);
                    if(dir==="LEFT" && uiData.left) uiData.action(uiData.left);
                } else {
                    if(dir === "DOWN") { showOverlay(qData); el.style.transform="none"; }
                    else { 
                        if(dir === (qData.ans || "UP").toUpperCase()) SCORE += 10;
                        COMPLETED.push(POOL.shift()); INDEX++; renderSessionCard(); 
                    }
                }
            } else { el.style.transition="0.3s"; el.style.transform="none"; }
        };
    }

    function showOverlay(d) {
        let content = `<strong>Theoretical Logic</strong>${fmt(d.expl)}<br><br><strong>Hint</strong>${fmt(d.context)}`;
        document.getElementById('overlay-text').innerHTML = content;
        document.getElementById('overlay').style.display = 'flex';
    }

    function closeOverlay() { document.getElementById('overlay').style.display = 'none'; }

    function showReport() {
        document.getElementById('header').style.display = 'none';
        document.getElementById('stack').style.display = 'none';
        const body = document.getElementById('report-body'); body.innerHTML = "";
        COMPLETED.forEach(d => {
            const item = document.createElement('div'); item.className = "report-item";
            item.innerHTML = `<strong>Question:</strong><div class="rep-text">${fmt(d.question)}</div><strong>Theoretical Logic:</strong><div class="rep-text">${fmt(d.expl)}</div><strong>Hint:</strong><div class="rep-text">${fmt(d.context)}</div>`;
            body.appendChild(item);
        });
        document.getElementById('report-screen').style.display = 'flex';
    }

    function fmt(t) {
        if(!t || t === "---") return "";
        return t.toString().replace(/\$/g, '').replace(/\*\*(.*?)\*\*/g, '<b>$1</b>')
                .replace(/\^([0-9\+\-]+)/g, '<sup>$1</sup>').replace(/_([0-9]+)/g, '<sub>$1</sub>');
    }
</script>
</body>
</html>
