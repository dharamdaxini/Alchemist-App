<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VIA.STACK | FINAL REPORT</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,600;1,600&family=Inter:wght@400;700;900&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #000; --card: #111; --gold: #ffd600; --blue: #2979FF; --green: #2ecc71; --red: #ff4444; --font-chem: 'Crimson Text', serif; --font-ui: 'Inter', sans-serif; --font-code: 'JetBrains Mono', monospace; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; user-select: none; }
        body { margin: 0; height: 100vh; background: var(--bg); color: #fff; font-family: var(--font-ui); overflow: hidden; position: fixed; width: 100%; touch-action: none; }
        
        /* --- LIBRARY GRID --- */
        #portal { height: 100%; padding: 40px 30px; overflow-y: auto; display: flex; flex-direction: column; z-index: 1000; touch-action: pan-y; }
        .brand { color: var(--gold); font-weight: 900; font-size: 2rem; letter-spacing: -1px; }
        .sub-brand { font-family: var(--font-code); font-size: 0.7rem; color: #555; margin-bottom: 30px; letter-spacing: 2px; }
        #search-box { width: 100%; background: #080808; border: 1px solid #222; padding: 15px; border-radius: 12px; color: var(--gold); font-family: var(--font-code); font-size: 0.8rem; text-transform: uppercase; margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding-bottom: 50px; }
        .tile { background: #0c0c0c; border: 1px solid #222; border-radius: 16px; padding: 25px; cursor: pointer; transition: 0.2s; }
        .tile:active { transform: scale(0.96); border-color: var(--gold); }
        .tile-name { font-weight: 900; font-size: 0.9rem; color: #fff; display: block; margin-bottom: 5px; }

        /* --- HUD --- */
        #header { width: 92%; margin: 25px auto 10px; z-index: 1000; display: none; }
        .progress-track { width: 100%; height: 3px; background: #1a1a1a; margin-top: 10px; border-radius: 10px; }
        #progress-bar { height: 100%; background: var(--gold); width: 0%; transition: 0.3s; }

        /* --- CARD STACK --- */
        #stack { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 94%; max-width: 420px; height: 65vh; display: none; align-items: center; justify-content: center; z-index: 500; }
        .card { position: absolute; width: 100%; height: 100%; background: #111; border-radius: 40px; border: 1px solid #262626; padding: 35px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; box-shadow: 0 30px 60px rgba(0,0,0,0.6); }
        .card-q { font-family: var(--font-chem); font-size: clamp(18px, 4vmin, 24px); line-height: 1.4; color: #fff; font-weight: 600; }
        .swipe-label { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.96); color: var(--gold); font-weight: 900; opacity: 0; pointer-events: none; border-radius: 40px; }

        /* --- REPORT SYSTEM --- */
        #report-screen { position: fixed; inset: 0; background: #000; z-index: 2000; display: none; flex-direction: column; padding: 30px; overflow-y: auto; touch-action: pan-y; user-select: text; }
        .report-header { color: var(--gold); font-weight: 900; font-size: 1.5rem; margin-bottom: 20px; text-transform: uppercase; border-bottom: 1px solid #222; padding-bottom: 10px; }
        .report-item { margin-bottom: 40px; border-bottom: 1px solid #1a1a1a; padding-bottom: 20px; }
        .rep-q { font-family: var(--font-chem); font-size: 1.2rem; color: #fff; margin-bottom: 10px; display: block; }
        .rep-ans { color: var(--green); font-family: var(--font-code); font-size: 0.75rem; text-transform: uppercase; margin-bottom: 15px; display: block; }
        .rep-section-label { color: var(--gold); font-weight: 900; font-size: 0.7rem; letter-spacing: 1px; display: block; margin-top: 15px; margin-bottom: 5px; text-transform: uppercase; }
        .rep-text { font-family: var(--font-chem); color: #bbb; line-height: 1.5; font-size: 1rem; }

        /* --- SUGGESTION BOX --- */
        .feedback-area { margin-top: 30px; background: #0a0a0a; padding: 20px; border-radius: 15px; border: 1px dashed #333; }
        #suggestion-text { width: 100%; background: #000; border: 1px solid #222; color: #fff; padding: 15px; border-radius: 10px; font-family: var(--font-ui); height: 100px; resize: none; margin-bottom: 15px; }
        .btn-action { width: 100%; padding: 20px; background: var(--gold); border: none; border-radius: 12px; font-weight: 900; text-transform: uppercase; cursor: pointer; color: #000; }

        /* --- OVERLAY --- */
        #overlay { position: fixed; inset: 0; background: #000; z-index: 3000; padding: 40px; display: none; flex-direction: column; justify-content: center; }
        .overlay-content { font-family: var(--font-chem); font-size: 1.1rem; color: #ddd; overflow-y: auto; flex: 1; line-height: 1.6; }
        sup { font-size: 0.6em; vertical-align: super; } sub { font-size: 0.6em; vertical-align: sub; } b { color: var(--gold); }
    </style>
</head>
<body>

<div id="report-screen">
    <div class="report-header">Session Report</div>
    <div id="report-body"></div>
    <div class="feedback-area">
        <div class="rep-section-label">Suggestions & Notes</div>
        <textarea id="suggestion-text" placeholder="Add observations for the database..."></textarea>
        <button class="btn-action" onclick="submitFeedback()">Submit & Start New</button>
    </div>
</div>

<div id="overlay"><div id="overlay-text" class="overlay-content"></div><button class="btn-action" onclick="document.getElementById('overlay').style.display='none'">RESUME</button></div>

<div id="portal">
    <div class="brand">VIA.STACK</div><div class="sub-brand">TERMINAL v131.73</div>
    <input type="text" id="search-box" placeholder="SEARCH VAULTS..." onkeyup="filterLibrary()">
    <div id="library" class="grid"></div>
</div>

<div id="header"><div class="progress-track"><div id="progress-bar"></div></div></div>
<div id="stack"></div>

<script>
    const TELEMETRY_URL = "https://script.google.com/macros/s/AKfycbzw-sTiiKTYqtnXJusEmxpx2Wv-8UG2VPdY29WOTSLwUold9LuTpBOv80aVmUAGDlIa6w/exec";
    const USER_ID = "STUDENT_" + Math.random().toString(36).substr(2, 9).toUpperCase();
    let db, VAULT = [], POOL = [], COMPLETED = [];

    const request = indexedDB.open("AlchemistDB", 1);
    request.onupgradeneeded = e => e.target.result.createObjectStore("Vaults");
    request.onsuccess = e => { db = e.target.result; loadLibrary(); };

    function filterLibrary() {
        const q = document.getElementById('search-box').value.toLowerCase();
        document.querySelectorAll('.tile').forEach(t => t.style.display = t.innerText.toLowerCase().includes(q) ? 'block' : 'none');
    }

    function loadLibrary() {
        const grid = document.getElementById('library'); grid.innerHTML = "";
        db.transaction(["Vaults"], "readonly").objectStore("Vaults").openCursor().onsuccess = e => {
            const c = e.target.result;
            if (c) {
                const el = document.createElement('div'); el.className = "tile";
                el.innerHTML = `<span class="tile-name">${c.key}</span><small style="color:#555">${c.value.length} MODULES</small>`;
                el.onclick = () => startSession(c.key);
                grid.appendChild(el); c.continue();
            }
        };
    }

    function startSession(name) {
        db.transaction(["Vaults"]).objectStore("Vaults").get(name).onsuccess = e => {
            VAULT = e.target.result || [];
            POOL = VAULT.sort(() => 0.5 - Math.random()).slice(0, 20);
            COMPLETED = [];
            document.getElementById('portal').style.display = 'none';
            document.getElementById('header').style.display = 'block';
            document.getElementById('stack').style.display = 'flex';
            renderCard();
        };
    }

    function renderCard() {
        const s = document.getElementById('stack'); s.innerHTML = "";
        if (!POOL.length) return showReport();
        const q = POOL[0];
        document.getElementById('progress-bar').style.width = `${(COMPLETED.length/20)*100}%`;
        const c = document.createElement('div'); c.className = "card";
        c.innerHTML = `<div class="card-q">${fmt(q.question)}</div><div class="swipe-label">RELEASE TO SELECT</div>`;
        s.appendChild(c); bindPhysics(c, q);
    }

    function bindPhysics(el, q) {
        let x=0, y=0, sx=0, sy=0, active=false;
        el.ontouchstart = e => { active=true; sx=e.touches[0].clientX; sy=e.touches[0].clientY; el.style.transition="none"; };
        const move = (cx, cy) => {
            if(!active) return; x=cx-sx; y=cy-sy;
            el.style.transform = `translate3d(${x}px,${y}px,0) rotate(${x/15}deg)`;
            el.querySelector('.swipe-label').style.opacity = Math.sqrt(x*x+y*y) > 50 ? 1 : 0;
        };
        window.ontouchmove = e => move(e.touches[0].clientX, e.touches[0].clientY);
        window.ontouchend = () => {
            if(!active) return; active=false;
            if(Math.abs(y) > 100 && y > 0) { showOverlay(q); el.style.transform="none"; }
            else if(Math.sqrt(x*x+y*y) > 100) { COMPLETED.push(POOL.shift()); renderCard(); }
            else { el.style.transition="0.3s"; el.style.transform="none"; }
        };
    }

    function showOverlay(d) {
        document.getElementById('overlay-text').innerHTML = `<span style="color:var(--gold);font-weight:900;font-size:0.7rem;">THEORETICAL LOGIC</span><br>${fmt(d.expl)}<br><br><span style="color:var(--gold);font-weight:900;font-size:0.7rem;">SYSTEM CONTEXT</span><br>${fmt(d.context)}`;
        document.getElementById('overlay').style.display = 'flex';
    }

    function showReport() {
        document.getElementById('header').style.display = 'none';
        document.getElementById('stack').style.display = 'none';
        const body = document.getElementById('report-body'); body.innerHTML = "";
        COMPLETED.forEach(d => {
            const row = document.createElement('div'); row.className = "report-item";
            row.innerHTML = `
                <span class="rep-q">${fmt(d.question)}</span>
                <span class="rep-ans">Correct: ${d.ans === 'UP' ? fmt(d.up) : d.ans === 'RIGHT' ? fmt(d.right) : fmt(d.left)}</span>
                <span class="rep-section-label">Theoretical Logic</span>
                <div class="rep-text">${fmt(d.expl)}</div>
                <span class="rep-section-label">Step 1</span>
                <div class="rep-text">${fmt(d.step_1)}</div>
                <span class="rep-section-label">Step 2</span>
                <div class="rep-text">${fmt(d.step_2)}</div>
                <span class="rep-section-label">System Context</span>
                <div class="rep-text">${fmt(d.context || "General Core")}</div>
            `;
            body.appendChild(row);
        });
        document.getElementById('report-screen').style.display = 'flex';
    }

    function submitFeedback() {
        const text = document.getElementById('suggestion-text').value;
        fetch(TELEMETRY_URL, { method: "POST", mode: "no-cors", body: JSON.stringify({ uid: USER_ID, feedback: text }) });
        location.reload();
    }

    function fmt(t) {
        if(!t || t === "---") return "";
        return t.toString().replace(/\$/g, '').replace(/\*\*(.*?)\*\*/g, '<b>$1</b>')
            .replace(/\^([0-9\+\-]+)/g, '<sup>$1</sup>').replace(/_([0-9]+)/g, '<sub>$1</sub>');
    }
</script>
</body>
</html>
