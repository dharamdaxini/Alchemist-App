<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0,
               user-scalable=no, viewport-fit=cover">
<title>VIA.STACK | SESSION v131.83</title>

<link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,600;1,600&family=Inter:wght@400;700;900&family=JetBrains+Mono&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#000;
  --card:#111;
  --gold:#ffd600;
  --blue:#2979FF;
  --green:#2ecc71;
  --font-chem:'Crimson Text', serif;
  --font-ui:'Inter', sans-serif;
  --font-code:'JetBrains Mono', monospace;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}

body{
  margin:0;
  height:100vh;
  background:var(--bg);
  color:#fff;
  font-family:var(--font-ui);
  overflow:hidden;
}

/* ================= HEADER ================= */
#header{
  width:92%;
  margin:25px auto 10px;
  display:none;
}
.header-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-family:var(--font-code);
  font-size:0.7rem;
  color:#555;
  letter-spacing:1px;
  text-transform:uppercase;
}
.progress-track{
  width:100%;
  height:3px;
  background:#1a1a1a;
  margin-top:10px;
  border-radius:10px;
}
#progress-bar{
  height:100%;
  width:0%;
  background:var(--gold);
  transition:0.3s;
}

/* ================= STACK ================= */
#stack{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:94%;
  max-width:420px;
  height:65vh;
  display:none;
  align-items:center;
  justify-content:center;
}

.card{
  position:absolute;
  width:100%;
  height:100%;
  background:var(--card);
  border-radius:40px;
  border:1px solid #262626;
  padding:35px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  box-shadow:0 30px 60px rgba(0,0,0,0.6);
}

.card-q{
  font-family:var(--font-chem);
  font-size:1.5rem;
  line-height:1.4;
  font-weight:600;
  color:#fff;
}

/* ================= SWIPE LABEL ================= */
.swipe-label{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,0.96);
  opacity:0;
  pointer-events:none;
  border-radius:40px;
  font-family:var(--font-code);
  font-size:0.75rem;
  letter-spacing:2px;
  color:var(--gold);
  text-transform:uppercase;
}

/* ================= OVERLAY ================= */
#overlay{
  position:fixed;
  inset:0;
  background:#000;
  z-index:2000;
  padding:40px;
  display:none;
  flex-direction:column;
}

.overlay-content{
  font-family:var(--font-chem);
  font-size:1.1rem;
  line-height:1.6;
  color:#ddd;
  overflow-y:auto;
  flex:1;
}

.label-block{
  display:block;
  margin-top:20px;
  margin-bottom:6px;
  font-family:var(--font-ui);
  font-size:0.75rem;
  font-weight:900;
  letter-spacing:1.5px;
  text-transform:uppercase;
  color:var(--gold);
}

.btn-action{
  width:100%;
  padding:20px;
  background:var(--gold);
  color:#000;
  border:none;
  border-radius:12px;
  font-weight:900;
  text-transform:uppercase;
  font-family:var(--font-ui);
}

sup{font-size:0.6em}
sub{font-size:0.6em}
b{color:var(--gold)}
</style>
</head>

<body>

<div id="header">
  <div class="header-top">
    <span id="sess-xp">0 XP</span>
    <span id="log-vault">VAULT</span>
  </div>
  <div class="progress-track">
    <div id="progress-bar"></div>
  </div>
</div>

<div id="stack"></div>

<div id="overlay">
  <div id="overlay-text" class="overlay-content"></div>
  <button class="btn-action" onclick="overlay.style.display='none'">RESUME</button>
</div>

<script>
/* ===== Boundary guard ===== */
const ACTIVE_VAULT = sessionStorage.getItem("ACTIVE_VAULT");
if(!ACTIVE_VAULT){ location.href="admin.html"; }

/* ===== State ===== */
let db, VAULT=[], POOL=[], COMPLETED=[], SCORE=0;

/* ===== DB ===== */
indexedDB.open("AlchemistDB",1).onsuccess=e=>{
  db=e.target.result;
  start();
};

function start(){
  document.getElementById("header").style.display="block";
  document.getElementById("stack").style.display="flex";
  document.getElementById("log-vault").innerText=ACTIVE_VAULT;

  db.transaction("Vaults").objectStore("Vaults")
  .get(ACTIVE_VAULT).onsuccess=e=>{
    const res=e.target.result;
    VAULT=res?.data||res||[];
    POOL=VAULT.slice().sort(()=>0.5-Math.random());
    render();
  };
}

function render(){
  if(!POOL.length){ location.href="admin.html"; return; }

  const q=POOL[0];
  document.getElementById("progress-bar").style.width=
    ((COMPLETED.length/(COMPLETED.length+POOL.length))*100)+"%";
  document.getElementById("sess-xp").innerText=SCORE+" XP";

  const s=document.getElementById("stack");
  s.innerHTML="";
  const c=document.createElement("div");
  c.className="card";
  c.innerHTML=`
    <div class="card-q">${fmt(q.question)}</div>
    <div class="swipe-label">RELEASE TO COMMIT</div>
  `;
  s.appendChild(c);
  bind(c,q);
}

function bind(el,q){
  let x=0,y=0,sx=0,sy=0,active=false;
  el.ontouchstart=e=>{active=true;sx=e.touches[0].clientX;sy=e.touches[0].clientY;};
  el.ontouchmove=e=>{
    if(!active)return;
    x=e.touches[0].clientX-sx;
    y=e.touches[0].clientY-sy;
    el.style.transform=`translate3d(${x}px,${y}px,0) rotate(${x/20}deg)`;
    el.querySelector(".swipe-label").style.opacity=
      Math.sqrt(x*x+y*y)>60?1:0;
  };
  el.ontouchend=()=>{
    if(!active)return;active=false;
    if(Math.sqrt(x*x+y*y)>100){
      if(y>80){ showOverlay(q); }
      else{
        if(q.ans && q.ans==="RIGHT" && x>0) SCORE+=10;
        if(q.ans && q.ans==="LEFT" && x<0) SCORE+=10;
        COMPLETED.push(POOL.shift());
        render();
      }
    }
    el.style.transform="none";
  };
}

function showOverlay(q){
  overlay.style.display="flex";
  overlayText.innerHTML=`
    <span class="label-block">Theoretical Logic</span>${fmt(q.expl)}
    <span class="label-block">What to learn now</span>${fmt(q.step_1)}
    <span class="label-block">What to learn next</span>${fmt(q.step_2)}
    <span class="label-block">Hint</span>${fmt(q.context)}
  `;
}

function fmt(t){
  if(!t||t==="---")return "";
  let txt=t.toString()
    .replace(/\*\*(.*?)\*\*/g,'<b>$1</b>')
    .replace(/\^\{([^}]+)\}/g,'<sup>$1</sup>')
    .replace(/_\{([^}]+)\}/g,'<sub>$1</sub>');
  return txt;
}
</script>

</body>
</html>
