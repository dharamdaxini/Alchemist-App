<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VIA.STACK | STUDENT</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:wght@600&family=Inter:wght@400;700;900&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #000; --card: #111; --gold: #ffd600; --blue: #2979FF; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; height: 100vh; overflow: hidden; position: fixed; width: 100%; touch-action: none; }
        #portal { padding: 30px; height: 100%; overflow-y: auto; }
        .tile { background: #0c0c0c; border: 1px solid #222; border-radius: 12px; padding: 20px; margin-bottom: 10px; cursor: pointer; }
        #stack { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; z-index: 100; }
        .card { width: 90%; max-width: 400px; height: 60vh; background: #111; border: 1px solid #333; border-radius: 30px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px; font-family: 'Crimson Text', serif; font-size: 1.5rem; position: relative; }
        .swipe-label { position: absolute; font-family: 'Inter', sans-serif; font-weight: 900; color: var(--gold); opacity: 0; font-size: 2rem; pointer-events: none; }
        #tools-modal, #overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 200; display: none; flex-direction: column; padding: 30px; justify-content: center; }
        .btn-close { padding: 15px; background: var(--gold); border: none; border-radius: 8px; font-weight: 900; margin-top: 20px; cursor: pointer; }
    </style>
</head>
<body>

<div id="portal">
    <div style="color:var(--gold); font-weight:900; font-size:1.5rem; margin-bottom:20px;">VIA.STACK</div>
    <div id="library"></div>
</div>

<div id="stack"></div>

<div id="overlay">
    <div id="overlay-text" style="line-height:1.6; color:#ddd; font-family:'Crimson Text', serif; font-size:1.2rem;"></div>
    <button class="btn-close" onclick="closeOverlay()">RESUME</button>
</div>

<script>
    let db, POOL = [];
    const request = indexedDB.open("AlchemistDB", 1);
    request.onsuccess = e => { db = e.target.result; loadLibrary(); };

    function loadLibrary() {
        const lib = document.getElementById('library'); lib.innerHTML = "";
        db.transaction(["Vaults"], "readonly").objectStore("Vaults").openCursor().onsuccess = e => {
            const cursor = e.target.result;
            if(cursor) {
                const div = document.createElement('div'); div.className = "tile";
                div.innerHTML = `<div style="font-weight:900">${cursor.key}</div><div style="font-size:0.8rem; color:#666">${cursor.value.length} CARDS</div>`;
                div.onclick = () => startSession(cursor.key);
                lib.appendChild(div);
                cursor.continue();
            }
        };
    }

    function startSession(key) {
        db.transaction(["Vaults"]).objectStore("Vaults").get(key).onsuccess = e => {
            POOL = (e.target.result || []).sort(() => Math.random() - 0.5);
            if(!POOL.length) return alert("Empty");
            document.getElementById('portal').style.display = 'none';
            document.getElementById('stack').style.display = 'flex';
            renderCard();
        };
    }

    function renderCard() {
        const s = document.getElementById('stack'); s.innerHTML = "";
        if(!POOL.length) return location.reload();
        const q = POOL[0];
        const c = document.createElement('div'); c.className = "card";
        c.innerHTML = `<div>${fmt(q.question)}</div><div class="swipe-label">SWIPE</div>`;
        s.appendChild(c);
        
        // Physics
        let startX = 0, startY = 0;
        c.addEventListener('touchstart', e => { startX = e.touches[0].clientX; startY = e.touches[0].clientY; });
        c.addEventListener('touchmove', e => {
            let dx = e.touches[0].clientX - startX;
            let dy = e.touches[0].clientY - startY;
            c.style.transform = `translate(${dx}px, ${dy}px) rotate(${dx/10}deg)`;
            if(Math.abs(dy) > 50 && dy > 0) { c.querySelector('.swipe-label').innerText = "DEEP DIVE"; c.querySelector('.swipe-label').style.opacity = 1; }
            else if(Math.abs(dx) > 50) { c.querySelector('.swipe-label').innerText = dx > 0 ? "RIGHT" : "LEFT"; c.querySelector('.swipe-label').style.opacity = 1; }
        });
        c.addEventListener('touchend', e => {
             let dx = e.changedTouches[0].clientX - startX;
             let dy = e.changedTouches[0].clientY - startY;
             if(dy > 100) { showOverlay(q); } // Deep Dive
             else if(Math.abs(dx) > 100) { POOL.shift(); renderCard(); }
             else { c.style.transform = ""; c.querySelector('.swipe-label').style.opacity = 0; }
        });
    }

    function showOverlay(d) {
        let html = `<strong>LOGIC:</strong> ${fmt(d.expl)}<br><br>`;
        if(d.step_1 && d.step_1 !== "---") html += `<strong>STEP 1:</strong> ${fmt(d.step_1)}<br>`;
        if(d.step_2 && d.step_2 !== "---") html += `<strong>STEP 2:</strong> ${fmt(d.step_2)}<br>`;
        document.getElementById('overlay-text').innerHTML = html;
        document.getElementById('overlay').style.display = 'flex';
    }
    
    function closeOverlay() { document.getElementById('overlay').style.display = 'none'; document.getElementById('stack').innerHTML = ""; POOL.shift(); renderCard(); }

    function fmt(t) { return (t||"").toString().replace(/\^([0-9\+\-]+)/g, '<sup>$1</sup>').replace(/_([0-9]+)/g, '<sub>$1</sub>'); }
</script>
</body>
</html>
