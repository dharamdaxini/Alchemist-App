<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VIA.STACK | FINAL</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">

    <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,600;1,600&family=Inter:wght@400;700;900&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #000; --card: #0a0a0a; --gold: #ffd600; --blue: #2979FF; --green: #2ecc71; --red: #ff4444; --font-chem: 'Crimson Text', serif; --font-ui: 'Inter', sans-serif; --font-code: 'JetBrains Mono', monospace; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; user-select: none; }
        body { margin: 0; height: 100vh; background: var(--bg); color: #fff; font-family: var(--font-ui); overflow: hidden; position: fixed; width: 100%; touch-action: none; }
        
        /* --- HUD (Starts Hidden) --- */
        #header { width: 92%; margin: 25px auto 10px; z-index: 1000; display: none; }
        .header-top { display: flex; justify-content: space-between; align-items: center; font-family: var(--font-code); font-size: 0.7rem; color: #555; }
        .tools-trigger { color: var(--blue); cursor: pointer; font-weight: 900; }
        .progress-track { width: 100%; height: 3px; background: #1a1a1a; margin-top: 10px; border-radius: 10px; }
        #progress-bar { height: 100%; background: var(--gold); width: 0%; transition: 0.3s; }

        #terminal-feed { position: absolute; top: 60px; right: 25px; z-index: 900; display: none; flex-direction: column; align-items: flex-end; font-family: var(--font-code); font-size: 0.65rem; color: #444; line-height: 1.5; pointer-events: none; }
        .feed-item { opacity: 0.5; transition: 0.3s; }
        .feed-item.active { color: var(--green); opacity: 1; font-weight: 700; text-shadow: 0 0 5px rgba(46, 204, 113, 0.2); }
        
        /* --- THE MONOLITH STACK --- */
        #stack { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 94%; max-width: 420px; height: 65vh; display: flex; align-items: center; justify-content: center; z-index: 500; }
        
        .card { 
            position: absolute; width: 100%; height: 100%; 
            background: var(--card); 
            border-radius: 40px; 
            border: 1px solid #1a1a1a; 
            padding: 35px; 
            display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; 
            box-shadow: 0 40px 100px rgba(0,0,0,0.9); 
            overflow: hidden; 
            transform-origin: 50% 100%;
        }

        /* CARD TYPOGRAPHY */
        .card-q { font-family: var(--font-chem); font-size: clamp(22px, 5vmin, 28px); line-height: 1.3; color: #eee; font-weight: 600; z-index: 2; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
        
        /* WIZARD TYPOGRAPHY */
        .wiz-meta { font-family: var(--font-code); color: #555; font-size: 0.65rem; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 25px; border: 1px solid #333; padding: 5px 12px; border-radius: 100px; }
        .wiz-title { font-family: 'Inter', sans-serif; font-weight: 900; font-size: 2.2rem; color: #fff; text-transform: uppercase; letter-spacing: -1px; line-height: 1; }

        /* --- COMPASS LABELS (SWIPE UI) --- */
        .swipe-label { 
            position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; 
            background: rgba(0,0,0,0.96); color: #fff; opacity: 0; pointer-events: none; 
            border-radius: 40px; transition: opacity 0.1s; z-index: 10;
        }
        .sl-badge { 
            font-family: var(--font-code); font-size: 0.6rem; color: var(--gold); 
            border: 1px solid var(--gold); padding: 6px 12px; border-radius: 100px; 
            margin-bottom: 20px; text-transform: uppercase; letter-spacing: 2px; font-weight: 700; background: rgba(255, 214, 0, 0.1);
        }
        .sl-text { font-family: 'Inter', sans-serif; font-weight: 800; font-size: 1.5rem; text-transform: uppercase; color: #fff; }

        /* --- TOOLS MODAL --- */
        #tools-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 3000; display: none; flex-direction: column; padding: 30px; align-items: center; justify-content: center; }
        .tools-head { width: 100%; max-width: 320px; display: flex; justify-content: space-between; border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 20px; font-family: var(--font-code); color: var(--gold); }
        #calc { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; width: 100%; max-width: 320px; }
        #calc-display { grid-column: span 4; background: #000; border: 1px solid #333; color: var(--green); padding: 15px; text-align: right; font-family: var(--font-code); font-size: 1.2rem; border-radius: 8px; margin-bottom: 10px; }
        .calc-btn { padding: 15px; background: #1a1a1a; border: none; border-radius: 8px; color: #fff; font-weight: 700; cursor: pointer; font-size: 1rem; }
        .calc-btn:active { background: var(--blue); }
        .calc-op { color: var(--gold); }

        /* --- OVERLAY --- */
        #overlay { position: fixed; inset: 0; background: #000; z-index: 2000; padding: 40px; display: none; flex-direction: column; }
        .overlay-content { font-family: var(--font-chem); font-size: 1.1rem; color: #ddd; overflow-y: auto; flex: 1; margin-bottom: 20px; line-height: 1.6; }
        .btn-close { padding: 20px; background: var(--gold); color: #000; border: none; border-radius: 12px; font-weight: 900; font-family: var(--font-ui); text-transform: uppercase; cursor: pointer; }
        strong { color: var(--gold); font-family: var(--font-ui); font-size: 0.8rem; letter-spacing: 1px; text-transform: uppercase; display: block; margin-top: 20px; margin-bottom: 5px; }
        
        sup { font-size: 0.6em; vertical-align: super; } sub { font-size: 0.6em; vertical-align: sub; } b { color: var(--gold); font-weight: 600; } 
    </style>
</head>
<body>

<div id="tools-modal">
    <div class="tools-head"><span>CALCULATOR</span><span onclick="toggleTools()" style="cursor:pointer; color:#fff;">✕</span></div>
    <div id="calc-display">0</div>
    <div id="calc">
        <button class="calc-btn" onclick="calcInput('7')">7</button><button class="calc-btn" onclick="calcInput('8')">8</button><button class="calc-btn" onclick="calcInput('9')">9</button><button class="calc-btn calc-op" onclick="calcInput('/')">/</button>
        <button class="calc-btn" onclick="calcInput('4')">4</button><button class="calc-btn" onclick="calcInput('5')">5</button><button class="calc-btn" onclick="calcInput('6')">6</button><button class="calc-btn calc-op" onclick="calcInput('*')">*</button>
        <button class="calc-btn" onclick="calcInput('1')">1</button><button class="calc-btn" onclick="calcInput('2')">2</button><button class="calc-btn" onclick="calcInput('3')">3</button><button class="calc-btn calc-op" onclick="calcInput('-')">-</button>
        <button class="calc-btn calc-op" onclick="calcInput('C')">C</button><button class="calc-btn" onclick="calcInput('0')">0</button><button class="calc-btn calc-op" onclick="calcInput('=')">=</button><button class="calc-btn calc-op" onclick="calcInput('+')">+</button>
    </div>
    <div style="margin-top:20px; border-top:1px solid #333; padding-top:10px; width:100%; max-width:320px;">
        <div style="font-family:var(--font-code); font-size:0.7rem; color:#555; margin-bottom:5px;">SYSTEM RESTORE</div>
        <input type="file" id="restore-file" style="display:none" onchange="restoreUserBackup(this)">
        <button class="calc-btn" style="width:100%; font-size:0.7rem; background:#111;" onclick="document.getElementById('restore-file').click()">LOAD COURSE DATA (JSON)</button>
    </div>
</div>

<div id="overlay">
    <div id="overlay-text" class="overlay-content"></div>
    <button class="btn-close" onclick="closeOverlay()">RESUME</button>
</div>

<div id="header">
    <div class="header-top"><span id="sess-xp">0 XP</span><span class="tools-trigger" onclick="toggleTools()">[ TOOLS ]</span></div>
    <div class="progress-track"><div id="progress-bar"></div></div>
</div>

<div id="terminal-feed">
    <div class="feed-item">READY</div>
    <div class="feed-item" id="log-vault">---</div>
    <div class="feed-item" id="log-dom">---</div>
    <div class="feed-item active" id="log-level">---</div>
</div>

<div id="stack"></div>

<script>
    const TELEMETRY_URL = "https://script.google.com/macros/s/AKfycbzw-sTiiKTYqtnXJusEmxpx2Wv-8UG2VPdY29WOTSLwUold9LuTpBOv80aVmUAGDlIa6w/exec";
    const USER_ID = "STUDENT_" + Math.random().toString(36).substr(2, 9).toUpperCase();

    // --- DEMO DATA FOR IMMEDIATE TESTING ---
    const DEMO_DATA = [
        {id:"001", set:"FUNDAMENTALS", dom:"PHYSICAL", level:"1", question:"What is the First Law of Thermodynamics?", up:"Conservation of Energy", right:"Energy is Created", left:"Entropy Increases", ans:"UP", expl:"Energy cannot be created or destroyed, only transformed."},
        {id:"002", set:"APPLICATION", dom:"ORGANIC", level:"2", question:"Which reaction increases carbon chain length?", up:"Grignard Reaction", right:"Hydrolysis", left:"Oxidation", ans:"UP", expl:"Grignard reagents react with carbonyls to form new C-C bonds."},
        {id:"003", set:"ANALYSIS", dom:"INORG", level:"2", question:"Why is d-orbital splitting larger in Sq. Planar?", up:"Ligand repulsion along axes", right:"Lower effective nuclear charge", left:"Spin-orbit coupling", ans:"UP", expl:"Ligands approach directly along x and y axes causing max repulsion."},
        {id:"004", set:"ADVANCED", dom:"SPECTRO", level:"3", question:"What does the chemical shift in NMR depend on?", up:"Electron Shielding", right:"Solvent Viscosity", left:"Sample Mass", ans:"UP", expl:"Shielding by surrounding electrons alters the effective B-field."},
        {id:"005", set:"FUNDAMENTALS", dom:"PHYSICAL", level:"1", question:"Unit of Entropy?", up:"J/K·mol", right:"J/mol", left:"kJ", ans:"UP", expl:"Entropy is energy per degree temperature."},
        {id:"006", set:"APPLICATION", dom:"ORGANIC", level:"2", question:"Product of SN2 reaction?", up:"Inversion of Config", right:"Racemic Mixture", left:"Retention", ans:"UP", expl:"Backside attack leads to Walden inversion."},
    ];

    let db, FULL_DB = [], POOL = [], SCORE = 0, INDEX = 1, CONFIG = {};
    
    // DB INIT
    const request = indexedDB.open("AlchemistDB", 1);
    request.onupgradeneeded = e => { e.target.result.createObjectStore("Vaults"); };
    request.onsuccess = e => { db = e.target.result; loadDatabase(); };

    function logEvent(action, payload) {
        if (!TELEMETRY_URL) return;
        fetch(TELEMETRY_URL, {
            method: "POST", mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ uid: USER_ID, action: action, payload: payload, ua: navigator.userAgent })
        }).catch(err => console.log("Log fail"));
    }

    function loadDatabase() {
        const tx = db.transaction(["Vaults"], "readonly");
        FULL_DB = [];
        tx.objectStore("Vaults").openCursor().onsuccess = e => {
            const cursor = e.target.result;
            if (cursor) {
                cursor.value.forEach(item => FULL_DB.push({...item, _originSet: cursor.key}));
                cursor.continue();
            } else {
                if(FULL_DB.length === 0) FULL_DB = DEMO_DATA; // Inject Demo Data
                renderWizardStep(1); 
            }
        };
    }

    // --- WIZARD LOGIC ---
    function renderWizardStep(step) {
        // HIDE HUD DURING WIZARD
        document.getElementById('header').style.display = 'none';
        document.getElementById('terminal-feed').style.display = 'none';

        let d = {};

        if (step === 1) { 
            const sets = [...new Set(FULL_DB.map(i => i.set || i._originSet))].slice(0, 4);
            d = { title: "CORE TOPIC", sub: "LAYER 1/5", type: "4WAY", up: sets[0], right: sets[1], left: sets[2], down: sets[3], action: (c) => { CONFIG.set = c; renderWizardStep(2); }};
        } else if (step === 2) { 
            const pool = FULL_DB.filter(i => (i.set || i._originSet) === CONFIG.set);
            const doms = [...new Set(pool.map(i => i.dom || "GENERAL"))].slice(0, 4);
            d = { title: "SELECT DOMAIN", sub: "LAYER 2/5", type: "4WAY", up: doms[0], right: doms[1], left: doms[2], down: doms[3], action: (c) => { CONFIG.dom = c; renderWizardStep(3); }};
        } else if (step === 3) { 
            let l = "BASICS", r = "DEEP DIVE";
            if(CONFIG.set && CONFIG.set.toUpperCase().includes("FUNDAMENTAL")) { l = "CONCEPTS"; r = "APPLICATION"; }
            d = { title: "SELECT DEPTH", sub: "LAYER 3/5", type: "2WAY", left: l, right: r, action: (c) => { CONFIG.depth = (c===l)?"LOW":"HIGH"; renderWizardStep(4); }};
        } else if (step === 4) { 
            d = { title: "SESSION LENGTH", sub: "LAYER 4/5", type: "2WAY", left: "10 CARDS", right: "20 CARDS", action: (c) => { CONFIG.count = (c.includes("10"))?10:20; renderWizardStep(5); }};
        } else if (step === 5) { 
            d = { title: "SELECT MODE", sub: "LAYER 5/5", type: "2WAY", left: "TRAINING", right: "EXAM", action: (c) => { CONFIG.mode = (c==="TRAINING")?"TRAIN":"EXAM"; launchSession(); }};
        }

        renderCardUI(d, true);
    }

    function launchSession() {
        let finalPool = FULL_DB.filter(i => (i.set || i._originSet) === CONFIG.set);
        finalPool = finalPool.filter(i => (i.dom || "GENERAL") === CONFIG.dom);
        if (CONFIG.depth === "LOW") finalPool = finalPool.filter(i => (!i.level || parseInt(i.level) <= 2));
        else finalPool = finalPool.filter(i => (parseInt(i.level) >= 3));

        POOL = finalPool.sort(() => 0.5 - Math.random()).slice(0, CONFIG.count);
        
        // Demo Fallback
        if(POOL.length === 0 && FULL_DB === DEMO_DATA) POOL = DEMO_DATA.slice(0, CONFIG.count);
        if(POOL.length === 0) { alert("No questions. Resetting."); renderWizardStep(1); return; }

        // REVEAL HUD
        document.getElementById('header').style.display = 'block';
        document.getElementById('terminal-feed').style.display = 'flex';
        SCORE = 0; INDEX = 1;
        logEvent("SESSION_START", `Set:${CONFIG.set} Mode:${CONFIG.mode}`);
        renderSessionCard();
    }

    // --- SESSION RENDER ---
    function renderSessionCard() {
        if (!POOL.length) return endSession();
        const q = POOL[0];
        
        document.getElementById('log-vault').innerText = CONFIG.set;
        document.getElementById('log-dom').innerText = CONFIG.dom;
        document.getElementById('log-level').innerText = "LVL " + (q.level || '1');
        document.getElementById('progress-bar').style.width = `${(INDEX/CONFIG.count)*100}%`;
        document.getElementById('sess-xp').innerText = `${SCORE} XP`;

        const d = {
            title: fmt(q.question),
            sub: "QUESTION " + INDEX,
            type: "4WAY",
            up: fmt(q.up),
            right: fmt(q.right),
            left: fmt(q.left),
            down: "DEEP DIVE"
        };
        renderCardUI(d, false, q);
    }

    // --- SHARED UI RENDERER (WIZARD + SESSION) ---
    function renderCardUI(d, isWizard, qData) {
        const s = document.getElementById('stack'); s.innerHTML = "";
        const c = document.createElement('div'); c.className = "card";
        
        let overlays = "";
        const lbl = isWizard ? "SELECT" : "OPTION";
        
        if(d.type === "4WAY") {
             if(d.up) overlays += `<div class="swipe-label sl-up"><span class="sl-badge">▲ ${isWizard?"SELECT":"OPTION 1"}</span><span class="sl-text">${d.up}</span></div>`;
             if(d.right) overlays += `<div class="swipe-label sl-right"><span class="sl-badge">▶ ${isWizard?"SELECT":"OPTION 2"}</span><span class="sl-text">${d.right}</span></div>`;
             if(d.left) overlays += `<div class="swipe-label sl-left"><span class="sl-badge">◀ ${isWizard?"SELECT":"OPTION 3"}</span><span class="sl-text">${d.left}</span></div>`;
             if(d.down) overlays += `<div class="swipe-label sl-down"><span class="sl-badge">▼ ${isWizard?"SELECT":"DEEP DIVE"}</span><span class="sl-text">${d.down}</span></div>`;
        } else {
             // 2-Way
             overlays += `<div class="swipe-label sl-left"><span class="sl-badge">◀ SELECT</span><span class="sl-text">${d.left}</span></div>`;
             overlays += `<div class="swipe-label sl-right"><span class="sl-badge">▶ SELECT</span><span class="sl-text">${d.right}</span></div>`;
        }

        if(isWizard) {
            c.innerHTML = `<div class="wiz-meta">${d.sub}</div><div class="wiz-title">${d.title}</div>${overlays}`;
        } else {
            c.innerHTML = `<div class="card-q">${d.title}</div>${overlays}`;
        }

        s.appendChild(c);
        bindPhysics(c, d, isWizard, qData);
    }

    // --- PHYSICS ENGINE (COMPASS LOGIC) ---
    function bindPhysics(el, uiData, isWizard, qData) {
        let x=0, y=0, sx=0, sy=0, active=false;
        el.ontouchstart = e => { active=true; sx=e.touches[0].clientX; sy=e.touches[0].clientY; el.style.transition="none"; };
        el.onmousedown = e => { active=true; sx=e.clientX; sy=e.clientY; el.style.transition="none"; };
        
        const move = (cx, cy) => {
            if (!active) return;
            let dx = cx-sx, dy = cy-sy;
            x = dx; y = dy; 
            
            // Rotation Physics
            requestAnimationFrame(() => { if(active) el.style.transform = `translate3d(${x}px,${y}px,0) rotate(${x/25}deg)`; });
            
            // Compass Detection
            el.querySelectorAll('.swipe-label').forEach(l => l.style.opacity = 0);
            const dist = Math.sqrt(dx*dx+dy*dy);
            
            if(dist > 40) {
                if(uiData.type === "2WAY") {
                    if(Math.abs(dx) > Math.abs(dy)) el.querySelector(dx > 0 ? ".sl-right" : ".sl-left").style.opacity = 1;
                } else {
                    const ang = Math.atan2(-dy, dx)*(180/Math.PI);
                    let d = (ang >= 45 && ang < 135) ? ".sl-up" : (ang >= 135 || ang < -135) ? ".sl-left" : (ang >= -135 && ang < -45) ? ".sl-down" : ".sl-right";
                    if(el.querySelector(d)) el.querySelector(d).style.opacity = 1;
                }
            }
        };
        
        window.ontouchmove = e => move(e.touches[0].clientX, e.touches[0].clientY);
        window.onmousemove = e => move(e.clientX, e.clientY);
        
        const end = () => {
            if(!active) return; active=false;
            const dist = Math.sqrt(x*x+y*y);
            
            if(dist > 100) { // Commit Threshold
                let dir = "";
                if(Math.abs(y) > Math.abs(x)) dir = y < 0 ? "UP" : "DOWN";
                else dir = x > 0 ? "RIGHT" : "LEFT";

                // WIZARD EXECUTION
                if(isWizard) {
                    if(uiData.type === "2WAY" && (dir === "UP" || dir === "DOWN")) { el.style.transition="0.3s"; el.style.transform="none"; return; }
                    if(dir==="UP" && uiData.up) uiData.action(uiData.up);
                    if(dir==="DOWN" && uiData.down) uiData.action(uiData.down);
                    if(dir==="RIGHT" && uiData.right) uiData.action(uiData.right);
                    if(dir==="LEFT" && uiData.left) uiData.action(uiData.left);
                    return;
                }

                // SESSION EXECUTION
                if(dir === "DOWN") { 
                    if(CONFIG.mode === "EXAM") { logEvent("EXAM_PEEK", qData.id); showOverlay(qData); el.style.transform="none"; }
                    else { showOverlay(qData); el.style.transform="none"; }
                } else { 
                    const isCorrect = dir === (qData.ans || "UP").toUpperCase();
                    if(isCorrect) SCORE += 10;
                    logEvent(isCorrect ? "CORRECT" : "WRONG", qData.id);
                    POOL.shift(); INDEX++; renderSessionCard(); 
                }
            } else { el.style.transition="0.3s"; el.style.transform="none"; }
        };
        window.ontouchend = end; window.onmouseup = end;
    }

    function showOverlay(d) {
        logEvent("DEEP_DIVE", d.id);
        let content = `<strong>Theoretical Logic</strong>${fmt(d.expl)}<br><br>`;
        if (d.step_1 && d.step_1 !== "---") content += `<strong>WHAT TO LEARN NOW</strong>${fmt(d.step_1)}<br>`;
        if (d.step_2 && d.step_2 !== "---") content += `<strong>WHAT TO LEARN NEXT</strong>${fmt(d.step_2)}<br>`;
        content += `<strong>System Context</strong>${fmt(d.context)}`;
        document.getElementById('overlay-text').innerHTML = content;
        document.getElementById('overlay').style.display = 'flex';
    }

    function closeOverlay() { document.getElementById('overlay').style.display = 'none'; }
    function endSession() { location.reload(); }
    function toggleTools() { const m = document.getElementById('tools-modal'); m.style.display = m.style.display === 'flex' ? 'none' : 'flex'; }
    function calcInput(val) {
        const disp = document.getElementById('calc-display');
        if (val === 'C') disp.innerText = '0';
        else if (val === '=') { try { disp.innerText = eval(disp.innerText); } catch { disp.innerText = 'ERR'; } }
        else { disp.innerText = disp.innerText === '0' ? val : disp.innerText + val; }
    }

    function fmt(t) { 
        if (!t || t === "---") return "";
        let txt = t.toString();
        txt = txt.replace(/\$/g, ''); 
        txt = txt.replace(/Spin-Orbit Coupling/g, '<b>Spin-Orbit Coupling</b>');
        txt = txt.replace(/\(SOC\)/g, '<b>(SOC)</b>');
        txt = txt.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
        txt = txt.replace(/\\alpha/g, 'α').replace(/\\beta/g, 'β').replace(/\\gamma/g, 'γ').replace(/\\Delta/g, 'Δ').replace(/\\to/g, '→');
        txt = txt.replace(/\^\{([^}]+)\}/g, '<sup>$1</sup>').replace(/\^([0-9\+\-]+)/g, '<sup>$1</sup>');
        txt = txt.replace(/_\{([^}]+)\}/g, '<sub>$1</sub>').replace(/_([0-9]+)/g, '<sub>$1</sub>');
        return txt;
    }

    function restoreUserBackup(input) {
        const file = input.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = e => {
            try {
                const data = JSON.parse(e.target.result);
                const tx = db.transaction(["Vaults"], "readwrite");
                const store = tx.objectStore("Vaults");
                if (!Array.isArray(data) && typeof data === 'object') {
                    Object.keys(data).forEach(key => store.put(data[key], key));
                } else { alert("Invalid Format."); return; }
                tx.oncomplete = () => { alert("SYSTEM RESTORED."); location.reload(); };
            } catch (err) { alert("FILE CORRUPT"); }
        };
        reader.readAsText(file);
    }
</script>
</body>
</html>
